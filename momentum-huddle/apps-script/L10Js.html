// Bulk actions: ONE request for the whole selection, one toast, one Undo.
// Doing five completions as five round-trips was five server calls and five
// full re-renders.
// ⚠ The selection must be scoped to what's ON SCREEN. The bulk bar counts
// `shown` (filter-passing rows) but the selection object outlives a filter
// change, so acting on Object.keys(state.todoSel) would write rows the user
// can't see and never counted — tick 5, filter to Overdue, read "2 selected",
// and silently complete 5 (each one posting to the team chat and moving the
// completion metric). Count and action must come from the same set.
function todoSelectedVisible_() {
  return state.boot.todos.filter(function (t) {
    return state.todoSel[String(t['ID'])] && todoOpen_(t['Status']) && todoMatches_(t);
  }).map(function (t) { return String(t['ID']); });
}
function runTodoBulk_(action) {
  if (action === 'clear') { state.todoSel = {}; renderTodos(); return; }
  var ids = todoSelectedVisible_();
  if (!ids.length) return;
  if (action === 'push') {
    var prev = {};
    ids.forEach(function (id) {
      var t = findRow(state.boot.todos, 'ID', id);
      if (t) { prev[id] = d10(t['Due']); t['Due'] = addDays_(d10(t['Due']), 7) || t['Due']; }
    });
    state.todoSel = {};
    renderTodos();
    gs('l10_pushTodoDue', ids, 7).then(function (res) {
      if (!res || res.ok === false) { errToast(res || 'Push failed'); refresh(); return; }
      // The server skips undated rows rather than inventing a date — say so
      // instead of letting the count quietly disagree with the click.
      var msg = res.moved.length + ' pushed a week' +
          (res.skipped.length ? ' · ' + res.skipped.length + ' skipped (no due date)' : '');
      notifyUndo(msg, function () {
        gs('l10_pushTodoDue', res.moved.map(function (m) { return m.id; }), -7)
            .then(function () { refresh(); notify('Undone', 'ok'); }).catch(errToast);
      });
    }).catch(function (e) { errToast(e); refresh(); });
    return;
  }
  var before = {};
  ids.forEach(function (id) {
    var t = findRow(state.boot.todos, 'ID', id);
    if (t) { before[id] = t['Status']; t['Status'] = action; t['Done At'] = action === 'DONE' ? localToday() : ''; }
  });
  state.todoSel = {};
  rerenderLists();
  gs('l10_setTodoStatusBulk', ids, action).then(function (res) {
    if (!res || res.ok === false) { errToast(res || 'Bulk update failed'); refresh(); return; }
    (res.nextRows || []).forEach(function (r) { state.boot.todos.push(r); });
    if (res.nextRows && res.nextRows.length) rerenderLists();
    if (res.failed && res.failed.length) {
      notify(res.done.length + ' updated · ' + res.failed.length + ' failed — reloading to resync', 'warn', 6000);
      refresh();
      return;
    }
    notifyUndo(res.done.length + ' to-dos → ' + action.toLowerCase(), function () {
      // Undo restores each row's OWN prior status — a mixed selection must not
      // come back as a uniform OPEN.
      var byPrev = {};
      res.done.forEach(function (id) { (byPrev[before[id]] = byPrev[before[id]] || []).push(id); });
      Promise.all(Object.keys(byPrev).map(function (st) {
        return gs('l10_setTodoStatusBulk', byPrev[st], st);
      })).then(function () { refresh(); notify('Undone', 'ok'); }).catch(errToast);
    });
  }).catch(function (e) { errToast(e); refresh(); });
}
function addDays_(ymd, n) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(ymd || ''))) return '';
  var d = new Date(ymd + 'T12:00:00');
  d.setDate(d.getDate() + n);
  return fmtLocal(d);
}

// A to-do that has been carried past the threshold gets re-filed rather than
// nagged about. Both doors keep the original text and drop the to-do, so the
// work moves house instead of existing twice.
function promoteStaleTodo_(id, kind) {
  var t = findRow(state.boot.todos, 'ID', id);
  if (!t) return;
  var text = String(t['To-Do']);
  var owner = String(t['Owner'] || '');
  var trail = 'Carried over from ' + id + ' — promoted from a to-do.';
  // l10_addRock keys on `title`, l10_addIssue on `text` — the two endpoints
  // genuinely differ; don't "tidy" one to match the other.
  var call = kind === 'rock'
      ? gs('l10_addRock', { title: text, owner: owner, notes: trail })
      : gs('l10_addIssue', { text: text, by: owner, notes: trail });
  call.then(function (res) {
    if (!res || res.ok === false) { errToast(res || 'Promote failed'); return; }
    if (kind === 'rock' && res.row) state.boot.rocks.push(res.row);
    if (kind !== 'rock' && res.row) state.boot.issues.push(res.row);
    serverSync(setTodoStatus_(id, 'DROPPED'));
    notify('Moved to ' + (kind === 'rock' ? 'a rock' : 'the issues list') + ' as ' + res.id + ' — the to-do is dropped.', 'ok', 7000);
  }).catch(errToast);

function wireShared(scope) {

        serverSync(gs('l10_reviveHeadline', id), undefined, hlRevert('KILLED'));
        notify('Undone — headline back on the list', 'ok');
      });
    });
  });
  // Milestones: toggle done on the node/label, two-click delete, inline add.
  scope.querySelectorAll('[data-ms]').forEach(function (el) {
    el.addEventListener('click', function () {
      var parts = el.dataset.ms.split('|');
      var m = findRow(state.boot.milestones || [], 'ID', parts[0]);
      var prev = m ? m['Status'] : '';
      if (m) {
        m['Status'] = parts[1];
        m['Done At'] = parts[1] === 'DONE' ? localToday() : '';
        rerenderLists();
      }
      gs('l10_setMilestoneStatus', parts[0], parts[1]).then(function (res) {
        if (!res || res.ok === false) { errToast(res || 'Save failed'); refresh(); return; }
        if (res.rockDone) {
          var r = findRow(state.boot.rocks, 'ID', res.rockDone);
          if (r) { r['Status'] = 'DONE'; rerenderLists(); }
          notify('🪨 Last milestone done — rock marked DONE', 'ok', 6000);
        } else if (m && prev !== parts[1]) {
          notifyUndo(parts[1] === 'DONE' ? 'Milestone done' : 'Milestone reopened', function () {
            var mm = findRow(state.boot.milestones || [], 'ID', parts[0]);
            if (mm) { mm['Status'] = prev; mm['Done At'] = prev === 'DONE' ? localToday() : ''; rerenderLists(); }
            serverSync(gs('l10_setMilestoneStatus', parts[0], prev));
            notify('Undone', 'ok');
          });
        } else {
          notify(parts[1] === 'DONE' ? 'Milestone done' : 'Milestone reopened', 'ok');
        }
      }).catch(function (e) { errToast(e); refresh(); });
    });
  });
  scope.querySelectorAll('[data-msdel]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation(); // the ✕ sits inside the toggle target
      if (!armedConfirm(el, { label: 'delete?', ttl: 2500 })) return;
      var id = el.dataset.msdel;
      // Keep the row for the Undo toast — delete is the one destructive act
      // here, so it gets the same escape hatch as every other one.
      var m = findRow(state.boot.milestones || [], 'ID', id);
      state.boot.milestones = (state.boot.milestones || []).filter(function (mm) {
        return String(mm['ID']) !== String(id);
      });
      rerenderLists();
      gs('l10_deleteMilestone', id).then(function (res) {
        if (!res || res.ok === false) { errToast(res || 'Delete failed'); refresh(); return; }
        // Removing the last open milestone completes the plan — the cascade is
        // deliberate (same as finishing it), but delete is destructive, so it
        // keeps the Undo. Capture the prior status BEFORE painting DONE so the
        // Undo can put the rock back too.
        var rockPrev = null;
        if (res.rockDone) {
          var r = findRow(state.boot.rocks, 'ID', res.rockDone);
          if (r) { rockPrev = String(r['Status']); r['Status'] = 'DONE'; rerenderLists(); }
        }
        var doneMsg = res.rockDone ?
            '🪨 Milestone deleted — the rest were done, so the rock is marked DONE' : 'Milestone deleted';
        if (!m) { notify(doneMsg, 'ok', res.rockDone ? 6000 : undefined); return; }
        notifyUndo(doneMsg, function () {
          var rockId = String(m['Rock ID']);
          var rkNow = findRow(state.boot.rocks, 'ID', rockId);
          // Pre-delete status: the cascade already painted local DONE, so the
          // captured value wins; otherwise the local row still holds it.
          var want = rockPrev !== null ? rockPrev : (rkNow ? String(rkNow['Status']) : '');
          // Put the rock back only when something flipped it: the delete's
          // own cascade, or the re-DONE below re-firing it on the server.
          function restoreRock_(flippedNow) {
            if (!(res.rockDone || flippedNow) || !want || want === 'DONE') return;
            if (rkNow) rkNow['Status'] = want;
            rerenderLists();
            serverSync(gs('l10_setRockStatus', rockId, want));
          }
          gs('l10_addMilestone', { rockId: rockId, text: m['Milestone'], due: d10(m['Due']), notes: m['Notes'] })
              .then(function (r2) {
                if (!r2 || r2.ok === false) { errToast(r2 || 'Undo failed'); return; }
                if (r2.row) (state.boot.milestones = state.boot.milestones || []).push(r2.row);
                // A completed milestone comes back completed (new id — the tab
                // is the audit trail, so the old row is not resurrected).
                if (String(m['Status']).toUpperCase() === 'DONE') {
                  r2.row['Status'] = 'DONE';
                  r2.row['Done At'] = d10(m['Done At']) || localToday();
                  // Sequenced, not parallel: re-marking it DONE can re-fire the
                  // server cascade, and the restore must have the last word.
                  gs('l10_setMilestoneStatus', r2.id, 'DONE')
                      .then(function (rs) { restoreRock_(!!(rs && rs.rockDone)); })
                      .catch(function (e) { errToast(e); refresh(); });
                } else {
                  restoreRock_(false);
                }
                rerenderLists();
                notify('Undone — milestone restored as ' + r2.id, 'ok');
              }).catch(errToast);
        });
      }).catch(function (e) { errToast(e); refresh(); });
    });
  });
  // The 🔗 on a milestone label sits inside the click-to-toggle target — the
  // link must open without flipping the milestone.
  scope.querySelectorAll('a.ms-link').forEach(function (a) {
    a.addEventListener('click', function (ev) { ev.stopPropagation(); });
  });
  // The add form doubles as the EDIT form: ✎ on a milestone label prefills it
  // and flips the button to Save (form.dataset.msedit carries the id).
  function msFormReset_(form) {
    delete form.dataset.msedit;
    form.querySelector('.js-ms-add').textContent = 'Add';
    form.querySelector('.ms-in-text').value = '';
    form.querySelector('.ms-in-due').value = '';
    var n = form.querySelector('.ms-in-notes');
    if (n) n.value = '';
  }
  scope.querySelectorAll('.ms-addlink').forEach(function (el) {
    el.addEventListener('click', function () {
      var form = el.closest('.rockline').querySelector('.ms-addform');
      if (!form) return;
      var open = form.style.display !== 'none';
      if (form.dataset.msedit) { msFormReset_(form); open = false; } // leave edit mode → fresh add
      form.style.display = open ? 'none' : 'flex';
      if (!open) form.querySelector('.ms-in-text').focus();
    });
  });
  scope.querySelectorAll('[data-msedit]').forEach(function (el) {
    el.addEventListener('click', function (ev) {
      ev.stopPropagation(); // the ✎ sits inside the toggle target
      var m = findRow(state.boot.milestones || [], 'ID', el.dataset.msedit);
      var rockline = el.closest('.rockline');
      var form = rockline ? rockline.querySelector('.ms-addform') : null;
      if (!m || !form) return;
      form.dataset.msedit = String(m['ID']);
      form.querySelector('.ms-in-text').value = String(m['Milestone'] || '');
      form.querySelector('.ms-in-due').value = d10(m['Due']);
      var ne = form.querySelector('.ms-in-notes');
      if (ne) ne.value = String(m['Notes'] || '');
      form.querySelector('.js-ms-add').textContent = 'Save';
      form.style.display = 'flex';
      form.querySelector('.ms-in-text').focus();
    });
  });
  scope.querySelectorAll('.js-ms-cancel').forEach(function (el) {
    el.addEventListener('click', function () {
      var form = el.closest('.ms-addform');
      msFormReset_(form);
      form.style.display = 'none';
    });
  });
  scope.querySelectorAll('.js-ms-add').forEach(function (btn) {
    var form = btn.closest('.ms-addform');
    var submit = function () {
      var text = form.querySelector('.ms-in-text').value.trim();
      var due = form.querySelector('.ms-in-due').value;
      var notes = ((form.querySelector('.ms-in-notes') || {}).value || '').trim();
      if (!text) { notify('Milestone needs a name.', 'warn'); return; }
      if (!due) { notify('Milestone needs a due date — the timeline places it by date.', 'warn'); return; }
      var editId = form.dataset.msedit;
      btn.disabled = true;
      if (editId) {
        gs('l10_editMilestone', editId, { text: text, due: due, notes: notes })
            .then(function (res) {
              if (!res || res.ok === false) { btn.disabled = false; errToast(res || 'Save failed'); return; }
              var m = findRow(state.boot.milestones || [], 'ID', editId);
              if (m) { m['Milestone'] = text; m['Due'] = due; m['Notes'] = notes; }
              notify('Updated ' + editId, 'ok');
              rerenderLists();
            })
            .catch(function (e) { btn.disabled = false; errToast(e); });
        return;
      }
      gs('l10_addMilestone', { rockId: btn.dataset.msrock, text: text, due: due, notes: notes })
          .then(function (res) {
            if (!res || res.ok === false) { btn.disabled = false; errToast(res || 'Add failed'); return; }
            if (res.row) (state.boot.milestones = state.boot.milestones || []).push(res.row);
            notify('Milestone added', 'ok');
            rerenderLists();
          })
          .catch(function (e) { btn.disabled = false; errToast(e); });
    };
    btn.addEventListener('click', submit);
    form.querySelectorAll('input').forEach(function (inp) {
      inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') submit(); });
    });
  });
  // Inline ✎ edits: flip the line into inputs, Save writes the row.
  scope.querySelectorAll('[data-edit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var parts = btn.dataset.edit.split('|');
      state.editing = { kind: parts[0], id: parts[1] };
      rerenderLists();
      var inp = document.querySelector('.ed-row .js-ed-text');
      if (inp && inp.offsetParent) inp.focus();
    });
  });
  scope.querySelectorAll('[data-edcancel]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.editing = null;
      rerenderLists();
    });
  });
  scope.querySelectorAll('.ed-row input').forEach(function (inp) {
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') inp.closest('.ed-row').querySelector('[data-edsave]').click();
      if (ev.key === 'Escape') { ev.stopPropagation(); state.editing = null; rerenderLists(); }
    });
  });
  scope.querySelectorAll('[data-edsave]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var parts = btn.dataset.edsave.split('|');
      var kind = parts[0], id = parts[1];
      var row = btn.closest('.ed-row');
      var text = row.querySelector('.js-ed-text').value.trim();
      if (!text) { notify('Text can\'t be empty.', 'warn'); return; }
      var ownerEl = row.querySelector('.js-ed-owner');
      var dueEl = row.querySelector('.js-ed-due');
      var owner = ownerEl ? ownerEl.value : '';
      var due = dueEl ? dueEl.value : '';
      state.editing = null;
      if (kind === 'todo') {
        var notesEl = row.querySelector('.js-ed-notes');
        var notes = notesEl ? notesEl.value : undefined;
        var repEl = row.querySelector('.js-ed-repeat');
        var repeat = repEl ? repEl.checked : undefined;
        var t = findRow(state.boot.todos, 'ID', id);
        if (t) {
          t['To-Do'] = text; t['Owner'] = owner; t['Due'] = due;
          if (notes !== undefined) t['Notes'] = notes;
          if (repeat !== undefined) t['Repeat'] = repeat ? 'WEEKLY' : '';
        }
        rerenderLists();
        serverSync(gs('l10_editTodo', id, { text: text, owner: owner, due: due, notes: notes, repeat: repeat }), 'Updated ' + id);
      } else if (kind === 'rock') {
        var doneEl = row.querySelector('.js-ed-done'), metEl = row.querySelector('.js-ed-metric');
        var doneTxt = doneEl ? doneEl.value.trim() : undefined;
        var metricId = metEl ? metEl.value : undefined;
        var r = findRow(state.boot.rocks, 'ID', id);
        if (r) {
          r['Rock'] = text; r['Owner'] = owner; r['Due'] = due;
          if (doneTxt !== undefined) r['Definition of Done'] = doneTxt;
          if (metricId !== undefined) r['Metric ID'] = metricId;
        }
        rerenderLists();
        // The fiscal-quarter chip is computed server-side — the edit call
        // returns the fresh fq so no full refresh is needed.
        gs('l10_editRock', id, { text: text, owner: owner, due: due, done: doneTxt, metricId: metricId })
            .then(function (res) {
              if (res && res.ok === false) { errToast(res); return refresh(); }
              var rr = findRow(state.boot.rocks, 'ID', id);
              if (rr && res && res.fq !== undefined) { rr.fq = res.fq; rerenderLists(); }
              notify('Updated ' + id, 'ok');
            })
            .catch(function (e) { errToast(e); refresh(); });
      } else if (kind === 'issue') {
        var acctEl = row.querySelector('.js-ed-acct'), catEl = row.querySelector('.js-ed-cat');
        var accounts = acctEl ? acctEl.value : '', category = catEl ? catEl.value : '';
        var i = findRow(state.boot.issues, 'ID', id);
        if (i) { i['Issue'] = text; i['Raised By'] = owner; i['Accounts'] = accounts; i['Category'] = category; }
        rerenderLists();
        serverSync(gs('l10_editIssue', id, { text: text, by: owner, accounts: accounts, category: category }), 'Updated ' + id);
      }
    });
  });
  var cap = scope.querySelector('.js-capture');
  if (cap) cap.addEventListener('click', function () { doCapture(scope); });
  var capWk = scope.querySelector('.js-cap-week');
  if (capWk) capWk.addEventListener('change', function () {
    state.capWeek = capWk.value === state.boot.weekOf ? null : capWk.value;
    renderScorecard();
    renderSegment();
  });
  wireCaveats(scope); // ⓘ disclosures (definition of done on rock lines)
  layoutTimelines(scope); // label lanes need rendered widths
}

function doCapture(scope) {
  var manual = {};
  scope.querySelectorAll('[data-cap]').forEach(function (inp) {
    if (inp.value !== '') manual[inp.dataset.cap] = inp.value;
  });
  var wkSel = scope.querySelector('.js-cap-week');
  var wk = (wkSel && wkSel.value) || state.boot.weekOf;
  var btn = scope.querySelector('.js-capture');
  if (btn) { btn.disabled = true; btn.textContent = 'Capturing…'; }
  gs('l10_captureWeek', wk, manual).then(function (res) {
    var notesEl = scope.querySelector('.js-cap-notes');
    if (res.notes && res.notes.length && notesEl) {
      notesEl.innerHTML = res.notes.map(function (n) {
        return '<div class="banner warn">' + esc(n) + '</div>';
      }).join('');
    }
    notify('Captured ' + Object.keys(res.written).length + ' metric(s)', 'ok');
    if (res.notes && res.notes.length) {
      notify(res.notes.length + ' value(s) could not be read — details below the capture button.', 'warn', 8000);
    }
    // Splice the captured values into local state — no full re-bootstrap.
    var vals = state.boot.scorecard.values;
    Object.keys(res.written).forEach(function (mid) {
      (vals[mid] = vals[mid] || {})[wk] = res.written[mid];
    });
    renderScorecard();
    renderSegment();
  }).catch(function (e) {
    if (btn) { btn.disabled = false; btn.textContent = '⟳ Capture'; }
    errToast(e);
  });
}

// Standalone pages

// The health roll-up strip + the 13-week read grid. Factored out so the "off
// track first" toggle re-renders only this block (the capture card's uncontrolled
// inputs below it are left untouched).
// --- Data-source health (v_l10_data_health) --------------------------------
// The warehouse scores each upstream source (FRESH/LAG/STALE/BROKEN); the app
// only decides what to SAY. HEALTH_MAP in L10_Config maps metric IDs to the
// source keys they depend on — a metric flags when any mapped source is
// STALE or BROKEN, in the grid and again at capture time.
function healthSources_() { return (state.health && state.health.sources) || []; }
function healthBad_() {
  return healthSources_().filter(function (s) { return s.status === 'STALE' || s.status === 'BROKEN'; });
}
function healthMap_() {
  try { return JSON.parse(String(state.boot.config.HEALTH_MAP || '{}')); } catch (e) { return {}; }
}
function metricHealthIssues_(id) {
  var keys = healthMap_()[String(id)] || [];
  if (!keys.length) return [];
  var by = {};
  healthSources_().forEach(function (s) { by[s.key] = s; });
  return keys.map(function (k) { return by[k]; })
      .filter(function (s) { return s && (s.status === 'STALE' || s.status === 'BROKEN'); });
}
function healthFlagPill_(id) {
  var bad = metricHealthIssues_(id);
  if (!bad.length) return '';
  return ' <span class="pill pill--sm pill--bad" title="' +
      esc(bad.map(function (s) { return s.label + ': ' + s.status + (s.lastDate ? ' (through ' + s.lastDate + ')' : ''); }).join(' · ')) +
      '">⛔ source ' + esc(bad[0].status.toLowerCase()) + '</span>';
}
// The always-visible line under a flagged metric — same house rule as caveats:
// the room reads the number WITH its warning, never behind a hover.
function healthFlagLine_(id) {
  var bad = metricHealthIssues_(id);
  if (!bad.length) return '';
  return '<div class="sc-cv-line sc-src-warn">' + bad.map(function (s) {
    return '⛔ ' + esc(s.label) + ' is ' + esc(s.status) +
        (s.lastDate ? ' (data through ' + esc(s.lastDate) + ')' : '') + ' — do not read this number as current.';
  }).join(' ') + '</div>';
}
function healthStripHtml_() {
  if (!state.health) return '';
  var bad = healthBad_();
  if (!bad.length) {
    return '<div class="sc-roll hlth-strip"><span class="sc-chip on" title="Checked ' +
        esc(state.health.checkedAt || '') + '">✓ Data sources fresh</span></div>';
  }
  return '<div class="sc-roll hlth-strip" role="group" aria-label="Data source health">' +
      bad.map(function (s) {
        return '<span class="sc-chip off" title="' + esc(s.detail || '') + '">⛔ ' + esc(s.label) +
            (s.lastDate ? ' · through ' + esc(s.lastDate) : '') + '</span>';
      }).join('') +
      '<span class="td-count">checked ' + esc(state.health.checkedAt || '') + ' · Momentum Huddle → Data health check for detail</span>' +
      '</div>';
}

function scGridHtml() {
  var b = state.boot;
  var wk = b.weekOf;
  var weeks = b.scorecard.weeks;
  var defs = b.scorecard.defs.filter(function (d) { return String(d['Active']).toUpperCase() === 'YES'; })
      .sort(function (x, y) { return (Number(x['Sort']) || 99) - (Number(y['Sort']) || 99); });
  // Canonical Sort-order index per metric — emitted as each row's data-ord, used
  // both as the off-first tiebreak and to restore the default order on toggle-off.
  var ord = {};
  defs.forEach(function (d, i) { ord[String(d['ID'])] = i; });
  // Current-week value (null = not captured) — the basis for both the roll-up and
  // the sort. "Captured" is tested on the raw value, NOT ruleCheck (a metric with
  // no goal returns null from ruleCheck yet may well have a value).
  function curVal(d) { var cv = (b.scorecard.values[String(d['ID'])] || {})[wk]; return (cv === undefined || cv === null || cv === '') ? null : cv; }
  var roll = defs.reduce(function (a, d) {
    var cv = curVal(d);
    if (cv === null) { a.nc++; return a; }
    var ck = ruleCheck(d, cv);
    if (ck === 'on') a.on++; else if (ck === 'off') a.off++; else a.neutral++;
    return a;
  }, { on: 0, off: 0, nc: 0, neutral: 0 });
  var strip = '<div class="sc-roll" role="group" aria-label="Scorecard health for the week of ' + esc(wk) + '">' +
      '<span class="sc-chip on"><b>' + roll.on + '</b> On track</span>' +
      '<span class="sc-chip off"><b>' + roll.off + '</b> Off track</span>' +
      '<span class="sc-chip nc"><b>' + roll.nc + '</b> Not captured</span>' +
      (roll.neutral ? '<span class="sc-chip neutral"><b>' + roll.neutral + '</b> No goal</span>' : '') +
      '<button type="button" id="sc-sort" class="sc-sortbtn' + (state.scSortOffFirst ? ' on' : '') +
        '" aria-pressed="' + (state.scSortOffFirst ? 'true' : 'false') + '">↑ Off track first</button>' +
      '</div>' + healthStripHtml_();
  if (state.scSortOffFirst) {
    // off → captured-on → no-goal → not-captured, Sort order within each group.
    defs = defs.slice().sort(function (a, c) {
      function rank(x) { var cv = curVal(x); if (cv === null) return 3; var ck = ruleCheck(x, cv); return ck === 'off' ? 0 : ck === 'on' ? 1 : 2; }
      return (rank(a) - rank(c)) || (ord[String(a['ID'])] - ord[String(c['ID'])]);
    });
  }
  var html = strip + '<div class="card scwrap"><table class="sc"><tr><th class="mname">Metric · owner</th><th>Goal</th><th>Trend</th>' +
      weeks.map(function (w) {
        var label = w.slice(5).replace('-', '/');
        return '<th' + (w === wk ? ' class="th-cur"' : '') + '>' + esc(label) + '</th>';
      }).join('') + '</tr>';
  defs.forEach(function (d) {
    var id = String(d['ID']);
    var vals = weeks.map(function (w) {
      var v = (b.scorecard.values[id] || {})[w];
      return v === undefined ? '' : v;
    });
    // Status for the sparkline color = the latest week that has a value.
    var lastV = null;
    for (var k = vals.length - 1; k >= 0; k--) { if (vals[k] !== '' && isFinite(Number(vals[k]))) { lastV = vals[k]; break; } }
    html += '<tr data-mid="' + esc(id) + '" data-ord="' + ord[id] + '"><td class="mname"><div class="mtitle">' + esc(d['Metric']) +
        '<button class="sc-edit" data-mbedit="' + esc(id) + '" title="Edit this metric" aria-label="Edit ' + esc(d['Metric']) + '">✎</button>' +
        caveatTip(d['Caveat']) + healthFlagPill_(id) + '</div>' +
        caveatLine(d['Caveat']) + healthFlagLine_(id) +
        '<div class="mowner">' + whoChip(d['Owner']) + '</div></td>' +
        '<td class="goal">' + goalLabel(d) + '</td>' +
        '<td>' + sparkline(vals, 90, 24, { goal: d['Goal'], goal2: d['Goal 2'], rule: String(d['Rule']), status: ruleCheck(d, lastV) }) + '</td>' +
        vals.map(function (v, i) {
          var isCur = weeks[i] === wk;
          var missing = (v === '');
          var check = ruleCheck(d, v);
          var cls = (isCur ? 'cur ' : '') + (missing ? 'sc-empty ' : '') + (check === 'on' ? 'cell-on' : check === 'off' ? 'cell-off' : '');
          var body;
          if (missing) {
            // Hatched cell + an sr-only word so "not captured" can't be misread as a real 0.
            body = '<span class="sr-only">not captured</span><span aria-hidden="true">·</span>';
          } else {
            var gly = check === 'on' ? '<span class="sc-gly" aria-hidden="true">✓</span>' :
                      check === 'off' ? '<span class="sc-gly" aria-hidden="true">✕</span>' : '';
            // Spell the headline status for screen readers on the current week only
            // (repeating it across 13 columns would flood the buffer).
            var sr = isCur && check ? ' <span class="sr-only">(' + (check === 'on' ? 'on track' : 'off track') + ')</span>' : '';
            body = gly + fmtVal(v, d['Format']) + sr;
          }
          return '<td class="' + cls.trim() + '">' + body + '</td>';
        }).join('') + '</tr>';
  });
  return html + '</table></div>';
}
// Re-sort by MOVING the existing <tr> nodes rather than re-rendering the grid —
// so the toggle button keeps focus (a re-render would drop keyboard/SR focus to
// <body>) and any caveat lines the user opened stay open.
function scReorder_() {
  var g = $('sc-grid');
  var table = g && g.querySelector('table.sc');
  if (!table) return;
  var b = state.boot, wk = b.weekOf;
  function defById(id) { return b.scorecard.defs.filter(function (d) { return String(d['ID']) === String(id); })[0]; }
  function curVal(d) { var cv = (b.scorecard.values[String(d['ID'])] || {})[wk]; return (cv === undefined || cv === null || cv === '') ? null : cv; }
  function rank(tr) { var d = defById(tr.getAttribute('data-mid')); if (!d) return 9; var cv = curVal(d); if (cv === null) return 3; var ck = ruleCheck(d, cv); return ck === 'off' ? 0 : ck === 'on' ? 1 : 2; }
  function ordOf(tr) { return Number(tr.getAttribute('data-ord')) || 0; }
  var rows = [].slice.call(table.querySelectorAll('tr[data-mid]'));
  rows.sort(state.scSortOffFirst
    ? function (a, c) { return (rank(a) - rank(c)) || (ordOf(a) - ordOf(c)); }
    : function (a, c) { return ordOf(a) - ordOf(c); });
  var holder = rows.length ? rows[0].parentNode : table; // implicit <tbody>
  rows.forEach(function (tr) { holder.appendChild(tr); }); // moves (doesn't recreate) the row
}
function wireScGrid(scope) {

}

// ===========================================================================
// Calendar scheduler — book a Google Calendar meeting from any point in the app.
// A calendar.google.com-style day view shows when the chosen calendars are busy
// (grey blocks / titled own-events) so the open time is obvious; click to place
// the meeting, drag to move it, drag the handle to resize, then create. Backend
// is Calendar.gs (Advanced Calendar Service: Freebusy.query + Events.insert).
// ===========================================================================
var SCHED_PXMIN = 0.8; // px per minute on the day grid (one hour = 48px)
state.sched = null;

function schedPad2_(n) { return (n < 10 ? '0' : '') + n; }
function schedHHMM_(min) { return schedPad2_(Math.floor(min / 60)) + ':' + schedPad2_(min % 60); }
function schedNowMin_() { var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function schedMinLabel_(min) {
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  var h = Math.floor(min / 60), m = min % 60, ap = h < 12 ? 'AM' : 'PM', h12 = h % 12 || 12;
  return h12 + (m ? ':' + schedPad2_(m) : '') + ' ' + ap;
}
function schedHourLabel_(h) { h = ((h % 24) + 24) % 24; return (h % 12 || 12) + ' ' + (h < 12 ? 'AM' : 'PM'); }
function schedDurLabel_(m) { if (m < 60) return m + ' min'; var h = Math.floor(m / 60), r = m % 60; return h + ' hr' + (r ? ' ' + r + ' min' : ''); }
function schedDateLabel_(ds) {
  var p = String(ds).split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getDay()] + ', ' +
      ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + ' ' + Number(p[2]);
}
function schedShiftDate_(ds, delta) {
  var p = String(ds).split('-'), d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + delta); return fmtLocal(d);
}
function schedShiftMonth_(ym, delta) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7)) - 1 + delta;
  y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return y + '-' + schedPad2_(m + 1);
}
function schedTzShort_(tz) {
  if (!tz) return ''; var parts = String(tz).split('/');
  return parts[parts.length - 1].replace(/_/g, ' ') + ' time';
}

function ensureSchedOverlay_() {
  if ($('sched-overlay')) return;

  div.id = 'sched-overlay';

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      var o = $('sched-overlay');

    }

}
function schedClose() {
  state.sched = null;

  if (o) { o.style.display = 'none'; o.innerHTML = ''; }
  dlgClosed_('sched-overlay');
}

// Entry point. opts = { title, source }  (source e.g. "issue:IS-001" or '').
function openScheduler(opts) {
  opts = opts || {};
  ensureSchedOverlay_();
  var os = $('sched-overlay');
  if (!os || os.style.display !== 'block') dlgOpened_('sched-overlay');
  var o = $('sched-overlay');
  o.innerHTML = '<div class="ids-backdrop" id="sched-backdrop"></div>' +
      '<div class="ids-card sched-card"><div class="ids-head"><div class="grow">' +

      '<div class="spinner">Checking availability…</div></div>';
  o.style.display = 'block';
  $('sched-close').addEventListener('click', schedClose);
  $('sched-backdrop').addEventListener('click', schedClose);

  // The calendar context (calendars, people, day bounds) is effectively static
  // for a session — cache it so every scheduler open after the first skips a
  // full server execution and goes straight to the availability read.
  var initSched_ = function (ctx) {
    state.sched = {
      ctx: ctx,
      title: String(opts.title || '').trim(),
      source: opts.source || '',
      calendarId: ctx.defaultCalendarId || 'primary',
      date: localToday(),

    };

    if (!ctx || !ctx.enabled) { schedRenderDisabled_(ctx); return; }

// Fetch the day's busy blocks for the current target + attendees, then redraw.
function schedLoadDay_() {
  var s = state.sched; if (!s) return;
  var seq = ++s.reqSeq;
  gs('l10_calDay', s.date, s.calendarId, s.attendees.slice()).then(function (day) {
    if (!state.sched || state.sched !== s || s.reqSeq !== seq) return; // superseded / closed
    s.day = day;
    if (s.startMin === null) s.startMin = schedFirstOpen_(day, s.durationMin);
    else s.startMin = schedClampStart_(s.startMin, day, s.durationMin);
    schedRender_();
    schedScrollToStart_();
  }).catch(function (e) {
    if (!state.sched || state.sched !== s || s.reqSeq !== seq) return;
    s.day = { date: s.date, timeZone: s.ctx.timeZone, isToday: (s.date === localToday()), nowMin: schedNowMin_(), dayStartMin: s.ctx.dayStart * 60, dayEndMin: s.ctx.dayEnd * 60, slotMin: s.ctx.slotMin, blocks: [] };
    if (s.startMin === null) s.startMin = schedFirstOpen_(s.day, s.durationMin);
    schedRender_();
    notify('Couldn\'t read availability — you can still pick a time. ' + ((e && e.message) || ''), 'warn', 6000);
  });
}

function schedFirstOpen_(day, dur) {
  var slot = day.slotMin || 30, from = day.dayStartMin;
  if (day.isToday) from = Math.max(from, day.nowMin);
  from = Math.ceil(from / slot) * slot;
  for (var t = from; t + dur <= day.dayEndMin; t += slot) {
    var clash = (day.blocks || []).some(function (b) { return b.start < t + dur && b.end > t; });
    if (!clash) return t;
  }
  return Math.max(day.dayStartMin, Math.min(from, day.dayEndMin - dur));
}
function schedClampStart_(t, day, dur) {
  var slot = day.slotMin || 30;
  t = Math.round(t / slot) * slot;
  return Math.max(day.dayStartMin, Math.min(t, day.dayEndMin - dur));
}
function schedConflicts_() {
  var s = state.sched; if (!s || !s.day || s.startMin === null) return false;
  var a0 = s.startMin, a1 = s.startMin + s.durationMin;
  return (s.day.blocks || []).some(function (b) { return b.start < a1 && b.end > a0; });
}

function schedRender_() {

      '<div class="ids-kicker">Schedule a meeting</div>' +

  $('sched-close').addEventListener('click', schedClose);
  $('sched-backdrop').addEventListener('click', schedClose);

function schedMiniHtml_() {

function schedDayHtml_() {
  var s = state.sched, d = s.day;
  var head = '<div class="cal-daynav">' +
      '<button type="button" class="nav" data-daynav="-1" title="Previous day">‹</button>' +

  if (!d) return '<div class="cal-day">' + head + '<div class="cal-empty-note">Loading availability…</div></div>';
  var top0 = d.dayStartMin, bot = d.dayEndMin, height = (bot - top0) * SCHED_PXMIN, inner = '';
  for (var h = Math.ceil(top0 / 60); h * 60 <= bot; h++) {

    inner += '<div class="cal-hour" style="top:' + y + 'px"><span class="hl">' + schedHourLabel_(h) + '</span></div>';
    if (h * 60 + 30 < bot) inner += '<div class="cal-halfhour" style="top:' + (y + 30 * SCHED_PXMIN) + 'px"></div>';
  }
  inner += schedBlocksHtml_(d.blocks || [], top0, bot);
  if (d.isToday) {
    var n = d.nowMin;

  }

  return '<div class="cal-day">' + head +
      '<div class="cal-scroll" id="sched-scroll"><div class="cal-grid" id="sched-grid" style="height:' + height + 'px">' + inner + '</div></div></div>';
}

// Clip busy blocks to the visible window and lane-pack overlaps like GCal.
function schedBlocksHtml_(blocks, top0, bot) {
  var vis = [];
  blocks.forEach(function (b) {
    var s0 = Math.max(b.start, top0), e0 = Math.min(b.end, bot);
    if (e0 > s0) vis.push({ start: s0, end: e0, label: b.label, self: b.self, lane: 0 });
  });
  vis.sort(function (a, b) { return (a.start - b.start) || (a.end - b.end); });
  var lanes = [];
  vis.forEach(function (b) {
    var placed = false;
    for (var i = 0; i < lanes.length; i++) { if (lanes[i] <= b.start) { b.lane = i; lanes[i] = b.end; placed = true; break; } }
    if (!placed) { b.lane = lanes.length; lanes.push(b.end); }
  });
  var n = Math.max(1, lanes.length);
  return vis.map(function (b) {
    var w = 100 / n;
    return '<div class="cal-block ' + (b.self ? 'self' : 'other') + '" style="top:' + ((b.start - top0) * SCHED_PXMIN) +
        'px;height:' + Math.max(12, (b.end - b.start) * SCHED_PXMIN) + 'px;left:calc(' + (b.lane * w) + '% + 2px);width:calc(' + w + '% - 4px)">' +
        '<span class="bt">' + esc(b.label) + '</span><span class="bh">' + schedMinLabel_(b.start) + '–' + schedMinLabel_(b.end) + '</span></div>';
  }).join('');
}

function schedPlaceProposed_() {
  var s = state.sched; if (!s || !s.day) return;

  if (s.startMin === null) { prop.style.display = 'none'; return; }
  prop.style.display = 'block';
  prop.style.top = ((s.startMin - s.day.dayStartMin) * SCHED_PXMIN) + 'px';
  prop.style.height = Math.max(14, s.durationMin * SCHED_PXMIN) + 'px';
  prop.classList.toggle('conflict', schedConflicts_());
  $('sched-prop-t').textContent = s.title || '(untitled meeting)';
  $('sched-prop-h').textContent = schedMinLabel_(s.startMin) + '–' + schedMinLabel_(s.startMin + s.durationMin);
}

function schedReadout_() {

}

function schedScrollToStart_() {

  var sc = $('sched-scroll'); if (!sc) return;

}

function schedWireForm_() {
  var s = state.sched, o = $('sched-overlay');
  var title = $('sched-title');
  if (title) title.addEventListener('input', function () { s.title = title.value; schedPlaceProposed_(); });
  var loc = $('sched-loc'); if (loc) loc.addEventListener('input', function () { s.location = loc.value; });
  var desc = $('sched-desc'); if (desc) desc.addEventListener('input', function () { s.description = desc.value; });
  var dur = $('sched-dur');
  if (dur) dur.addEventListener('change', function () {
    s.durationMin = Number(dur.value) || s.durationMin;
    if (s.startMin !== null) s.startMin = schedClampStart_(s.startMin, s.day, s.durationMin);
    schedPlaceProposed_(); schedReadout_();
  });
  var cal = $('sched-cal');
  if (cal) cal.addEventListener('change', function () { s.calendarId = cal.value; schedLoadDay_(); });
  var date = $('sched-date');

  });

}

// Mini month is wired on its own so a month flip re-binds only its buttons — not
// the shared inputs above it (which would double-fire).
function schedWireMini_() {
  var s = state.sched, wrap = $('sched-mini'); if (!wrap) return;
  wrap.querySelectorAll('[data-mini]').forEach(function (b) {
    b.addEventListener('click', function () { s.date = b.dataset.mini; s.miniMonth = s.date.slice(0, 7); s.startMin = null; schedLoadDay_(); });
  });
  wrap.querySelectorAll('[data-miminav]').forEach(function (b) {

function schedWireDay_() {
  var s = state.sched, o = $('sched-overlay');
  o.querySelectorAll('[data-daynav]').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = Number(b.dataset.daynav);
      s.date = v === 0 ? localToday() : schedShiftDate_(s.date, v);
      s.miniMonth = s.date.slice(0, 7); s.startMin = null; schedLoadDay_();
    });
  });
  var grid = $('sched-grid');
  if (grid) grid.addEventListener('pointerdown', function (ev) {
    if (ev.target.closest('#sched-prop')) return;
    var t = schedYtoMin_(ev.clientY); if (t === null) return;
    s.startMin = schedClampStart_(t, s.day, s.durationMin);
    schedPlaceProposed_(); schedReadout_();
  });
  schedWirePropDrag_();
}

function schedYtoMin_(clientY) {
  var s = state.sched, grid = $('sched-grid'); if (!grid || !s.day) return null;
  var r = grid.getBoundingClientRect();
  return s.day.dayStartMin + (clientY - r.top) / SCHED_PXMIN;
}

function schedWirePropDrag_() {
  var s = state.sched, prop = $('sched-prop'); if (!prop) return;
  var resize = $('sched-prop-resize'), mode = null, grabOff = 0;
  function move(ev) {
    if (!mode) return;
    var t = schedYtoMin_(ev.clientY); if (t === null) return;
    var slot = s.day.slotMin || 30;
    if (mode === 'move') {
      s.startMin = Math.max(s.day.dayStartMin, Math.min(Math.round((t - grabOff) / slot) * slot, s.day.dayEndMin - s.durationMin));
    } else {
      var dur = Math.round((t - s.startMin) / slot) * slot;
      s.durationMin = Math.max(slot, Math.min(dur, s.day.dayEndMin - s.startMin));
    }
    schedPlaceProposed_(); schedReadout_();
  }
  function up() {
    mode = null; prop.classList.remove('dragging');
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
    var ds = $('sched-dur');
    if (ds) {
      if (!Array.prototype.some.call(ds.options, function (op) { return Number(op.value) === s.durationMin; })) {
        var opt = document.createElement('option'); opt.value = s.durationMin; opt.textContent = schedDurLabel_(s.durationMin); ds.insertBefore(opt, ds.firstChild);
      }
      ds.value = String(s.durationMin);
    }
  }
  function down(ev, m) {
    ev.preventDefault(); ev.stopPropagation();
    mode = m; prop.classList.add('dragging');
    if (m === 'move') { var t = schedYtoMin_(ev.clientY); grabOff = (t === null ? 0 : t - s.startMin); }
    document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
  }
  prop.addEventListener('pointerdown', function (ev) { if (ev.target === resize) return; down(ev, 'move'); });
  if (resize) resize.addEventListener('pointerdown', function (ev) { down(ev, 'resize'); });
}

function schedCreate_() {
  var s = state.sched; if (!s || s.creating) return;
  var titleEl = $('sched-title'), title = titleEl ? titleEl.value.trim() : s.title;
  if (!title) { notify('Give the meeting a title first.', 'warn'); if (titleEl) titleEl.focus(); return; }
  if (s.startMin === null) { notify('Pick a time on the day view first.', 'warn'); return; }
  s.title = title;
  s.location = ($('sched-loc') || {}).value || '';
  s.description = ($('sched-desc') || {}).value || '';
  s.creating = true;
  var btn = $('sched-create'); if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  gs('l10_calCreate', {
    title: title, date: s.date, startTime: schedHHMM_(s.startMin), durationMin: s.durationMin,
    calendarId: s.calendarId, attendees: s.attendees.slice(),
    location: s.location, description: s.description, source: s.source
  }).then(function (res) {
    if (!res || !res.ok) throw new Error((res && res.message) || 'Create failed.');
    schedSuccess_(res, title);
  }).catch(function (e) {
    s.creating = false; if (btn) { btn.disabled = false; btn.textContent = 'Add to Google Calendar'; }
    state.calCtx = null; // a failed create may mean permissions changed — refetch next open

  });
}

// ---- Custom digests editor (mirrors the segment editor) ---------------------
// A fresh working copy of a rule; content is copied so edits never mutate boot.
function digestClone_(r) {
  return {
    id: r.id || '', person: r.person, label: r.label || '',
    content: (r.content || []).slice(), freq: r.freq || 'DAILY',
    weekday: r.weekday || '', hour: (r.hour === undefined ? 8 : Number(r.hour)),
    enabled: r.enabled !== false, offRoster: !!r.offRoster
  };
}
function digestDefault_(person) {
  return { id: '', person: person, label: '', content: ['TODOS'], freq: 'DAILY', weekday: '', hour: 8, enabled: true };
}
var DIGEST_CONTENT_LABELS = { TODOS: 'To-dos', ROCKS: 'Rocks', SCORECARD: 'Scorecard', HEADLINES: 'Headlines' };
function digestHourLabel_(h) {
  var ap = h < 12 ? 'AM' : 'PM', hr = h % 12; if (hr === 0) hr = 12;
  return hr + ':00 ' + ap;
}
// One sub-block per person (team order first, then off-roster persons flagged),
// each with that person's rule rows + an "Add digest" button. A team member with
// no rules still gets an (empty) block so they can add one.
function digestRowsHtml_(rules, team) {
  team = team || [];
  function ruleRow(r) {
    var weekly = String(r.freq).toUpperCase() === 'WEEKLY';
    var content = r.content || [];
    var boxes = ['TODOS', 'ROCKS', 'SCORECARD', 'HEADLINES'].map(function (tok) {
      return '<label class="ck-lbl mr-2">' +
        '<input type="checkbox" class="js-d-content" value="' + tok + '"' + (content.indexOf(tok) !== -1 ? ' checked' : '') + '> ' +
        DIGEST_CONTENT_LABELS[tok] + '</label>';
    }).join('');
    var freqSel = '<select class="js-d-freq">' + [['DAILY', 'Daily'], ['WEEKDAYS', 'Weekdays'], ['WEEKLY', 'Weekly']].map(function (o) {
      return '<option value="' + o[0] + '"' + (String(r.freq).toUpperCase() === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    }).join('') + '</select>';
    var wdSel = '<select class="js-d-weekday"' + (weekly ? '' : ' style="display:none"') + '>' +
      ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) {
        return '<option value="' + d + '"' + (r.weekday === d ? ' selected' : '') + '>' + d + '</option>';
      }).join('') + '</select>';
    var hrOpts = '';
    for (var h = 0; h < 24; h++) hrOpts += '<option value="' + h + '"' + (Number(r.hour) === h ? ' selected' : '') + '>' + digestHourLabel_(h) + '</option>';
    return '<div class="row d-rule" data-drow="' + esc(r.id || '') + '" data-dperson="' + esc(r.person) + '" data-dlabel="' + esc(r.label || '') + '">' +
        '<span class="muted d-note">Include:</span>' + boxes +
        '<span class="muted txt-3">·</span>' + freqSel + wdSel +
        '<span class="muted txt-3">at</span><select class="js-d-hour">' + hrOpts + '</select>' +
        '<label class="ck-lbl"><input type="checkbox" class="js-d-enabled"' + (r.enabled !== false ? ' checked' : '') + '> on</label>' +
        '<button class="btn mini subtle" data-ddel type="button" title="Remove digest">✕</button>' +
        '</div>';
  }
  function personBlock(name, offRoster) {
    var mine = rules.filter(function (r) { return String(r.person).toLowerCase() === String(name).toLowerCase(); });
    return '<div data-dblock="' + esc(name) + '" class="set-block">' +
        '<div class="set-block-h">' + avatar(name) + esc(name) + (offRoster ? ' <span class="tag">off roster</span>' : '') + '</div>' +
        mine.map(ruleRow).join('') +
        '<button class="btn mini subtle" data-dadd="' + esc(name) + '" type="button">＋ Add digest</button>' +
        '</div>';
  }
  var seen = {};
  var html = team.map(function (name) { seen[String(name).toLowerCase()] = 1; return personBlock(name, false); }).join('');
  var offNames = [];
  rules.forEach(function (r) {
    var lc = String(r.person).toLowerCase();
    if (!seen[lc]) { seen[lc] = 1; offNames.push(r.person); }
  });
  html += offNames.map(function (name) { return personBlock(name, true); }).join('');
  return html;
}
function digestCollect_() {
  var out = [];
  document.querySelectorAll('#digest-editor [data-drow]').forEach(function (row) {
    var content = [];
    row.querySelectorAll('.js-d-content:checked').forEach(function (cb) { content.push(cb.value); });
    out.push({
      id: row.getAttribute('data-drow') || '',
      person: row.getAttribute('data-dperson'),
      label: row.getAttribute('data-dlabel') || '', // round-trip a sheet-authored subject label
      content: content,
      freq: row.querySelector('.js-d-freq').value,
      weekday: row.querySelector('.js-d-weekday').value,
      hour: Number(row.querySelector('.js-d-hour').value),
      enabled: row.querySelector('.js-d-enabled').checked
    });
  });
  return out;
}
// --- Settings-page lazy data ------------------------------------------------
// The notify + digests tables ride OFF the boot payload (two tab reads for a
// page most sessions never open). They fetch the first time the page is
// actually visible and cache for the session; when the data lands only the two
// cards are patched — never the whole page, where someone may be mid-edit.
function notifyCardInner_() {
  var sdat = state.settingsData;
  var head = '<h3>Notifications</h3>' +
      '<p class="help mt-0">Each person picks how much email they get. The day-before <b>heads-up</b> is their own to-dos + rocks due; the <b>recap</b> is the after-huddle summary. (Chat pings stay a team-space broadcast for now.)</p>';
  if (!sdat) return head + '<div class="help">Loading current preferences…</div>';
  var labels = { EVERY: 'Every huddle', BIWEEKLY: 'Every other huddle', MONTHLY: 'First huddle each month', OFF: 'Off' };
  return head + '<table class="data"><tr><th>Person</th><th>Heads-up email</th><th>Recap email</th></tr>' +
      (sdat.notify || []).map(function (n) {
        return '<tr data-nrow="' + esc(n.person) + '">' +
          '<td>' + avatar(n.person) + esc(n.person) + (n.offRoster ? ' <span class="tag">off roster</span>' : '') + '</td>' +
          '<td><label class="ck-lbl"><input type="checkbox" class="js-n-headsup"' + (n.headsup ? ' checked' : '') + '> on</label></td>' +
          '<td><select class="js-n-recap">' + ['EVERY', 'BIWEEKLY', 'MONTHLY', 'OFF'].map(function (c) {
            return '<option value="' + c + '"' + (String(n.recap).toUpperCase() === c ? ' selected' : '') + '>' + labels[c] + '</option>';
          }).join('') + '</select></td></tr>';
      }).join('') +
      '</table>' +
      '<button class="btn mt-3" id="set-save-notify">Save notifications</button>';
}
function digestsCardInner_() {
  var head = '<h3>Custom digests</h3>' +
      '<p class="help mt-0">On top of the heads-up and recap above, add your own scheduled emails — pick the content, how often, and the time of day. Example: just your to-dos, every morning at 8. Mix and match; add nothing and nothing changes.</p>';
  if (!state.settingsData) return head + '<div class="help">Loading current digests…</div>';
  return head + '<div id="digest-editor">' + digestRowsHtml_(state.digests, (state.boot && state.boot.team) || []) + '</div>' +
      '<button class="btn mt-3" id="set-save-digests">Save digests</button>';
}
function reDigest_() {
  var ed = $('digest-editor');
  if (!ed) return;
  ed.innerHTML = digestRowsHtml_(state.digests, (state.boot && state.boot.team) || []);
  wireDigestEditor_();
}
function wireDigestEditor_() {
  var ed = $('digest-editor');
  if (!ed) return;
  ed.querySelectorAll('[data-dadd]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      state.digests = digestCollect_();
      state.digests.push(digestDefault_(btn.getAttribute('data-dadd')));
      reDigest_();
    });
  });
  // One ✕ per rule row, in the same document order as digestCollect_'s rows, so
  // the button's index is the rule's index in the freshly collected array.
  ed.querySelectorAll('[data-ddel]').forEach(function (btn, delIdx) {
    btn.addEventListener('click', function () {
      state.digests = digestCollect_();
      if (delIdx < state.digests.length) state.digests.splice(delIdx, 1);
      reDigest_();
    });
  });
  ed.querySelectorAll('.js-d-freq').forEach(function (sel) {
    sel.addEventListener('change', function () {
      state.digests = digestCollect_(); // reveal/hide the weekday select
      reDigest_();
    });
  });
}
function wireNotifyDigests_() {
  var sn = $('set-save-notify');
  if (sn) sn.addEventListener('click', function () {
    var rows = [];
    document.querySelectorAll('#card-notify [data-nrow]').forEach(function (tr) {
      rows.push({
        person: tr.getAttribute('data-nrow'),
        headsup: tr.querySelector('.js-n-headsup').checked,
        recap: tr.querySelector('.js-n-recap').value
      });
    });
    sn.disabled = true;
    gs('l10_saveNotifyPrefs', rows).then(function (res) {
      sn.disabled = false;
      if (!res || !res.ok) { errToast(res || 'Save failed'); return; }
      if (state.settingsData) state.settingsData.notify = rows; // splice locally so later re-renders reflect the saved state
      notify('Notification preferences saved', 'ok');
    }).catch(function (e) { sn.disabled = false; errToast(e); });
  });
  wireDigestEditor_();
  var sd = $('set-save-digests');
  if (sd) sd.addEventListener('click', function () {
    state.digests = digestCollect_();
    sd.disabled = true;
    gs('l10_saveDigests', state.digests).then(function (res) {
      sd.disabled = false;
      if (!res || !res.ok) { errToast(res || 'Save failed'); return; }
      // Splice the canonical set (server-minted ids) back so later edits are stable.
      if (state.settingsData) state.settingsData.digests = res.digests;
      state.digests = (res.digests || []).map(digestClone_);
      notify('Custom digests saved', 'ok');
      reDigest_();
    }).catch(function (e) { sd.disabled = false; errToast(e); });
  });
}
function fetchSettingsData_() {
  if (state.settingsData || state.settingsDataInflight) return;
  var page = $('page-settings');
  if (!page || !page.classList.contains('visible')) return; // fetch only when someone is looking
  state.settingsDataInflight = true;
  gs('l10_settingsData').then(function (d) {
    state.settingsDataInflight = false;
    state.settingsData = d || { notify: [], digests: [] };
    state.digests = (state.settingsData.digests || []).map(digestClone_);
    var nc = $('card-notify'), dc = $('card-digests');
    if (nc) nc.innerHTML = notifyCardInner_();
    if (dc) dc.innerHTML = digestsCardInner_();
    wireNotifyDigests_();
  }).catch(function () { state.settingsDataInflight = false; });
}
function renderSettings() {
  var page = $('page-settings');
  if (!page) return;
  if (!hyd('core')) return pageLoading_('page-settings');
  var b = state.boot, cfg = b.config || {};
  state.setSegs = (b.segments || []).map(function (sg) { return [String(sg[0]), Number(sg[1]) || 5]; });
  state.digests = ((state.settingsData && state.settingsData.digests) || []).map(digestClone_);
  var chimeOn = String(cfg.TIMER_CHIME || 'YES').toUpperCase() !== 'NO';
  var html = '<h2 class="page-title">Settings</h2><p class="page-sub">The friendlier pen for L10_Config. Changes save straight to the config tab — the sheet stays the audit trail.</p>';

  // Meeting + agenda
  html += '<div class="card"><h3>Meeting</h3><div class="row">' +
      '<div class="field"><label>Meeting name</label><input id="set-name" value="' + esc(cfg.MEETING_NAME || 'Paid Media Momentum Huddle') + '"></div>' +
      '<div class="field"><label>Day of the week</label><select id="set-day">' +
        ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'].map(function (d) {
          return '<option' + (d === String(cfg.HUDDLE_DAY || 'Monday') ? ' selected' : '') + '>' + d + '</option>';
        }).join('') + '</select></div></div>' +
      '<label class="ck-lbl mb-3">' +
        '<input type="checkbox" id="set-chime"' + (chimeOn ? ' checked' : '') + '> Play a soft chime when a segment goes over time</label>' +
      '<div class="field"><label>Agenda — segments and minutes</label>' +
      '<div id="seg-editor">' + segRowsHtml_() + '</div>' +
      '<button class="btn mini subtle" id="seg-add" type="button">＋ Add segment</button>' +
      '<div class="help">Renaming is safe — segments match their meeting screens by keywords (check-in, scorecard, rock, headline, to-do, issue), and anything else lands on Conclude.</div></div>' +
      '<button class="btn" id="set-save-meeting">Save meeting settings</button></div>';

  // Team
  html += '<div class="card"><h3>Team</h3><div class="row mb-3">' +
      (b.team || []).map(function (p) { return '<span class="person-chip on is-static">' + avatar(p) + esc(p) + '</span>'; }).join(' ') + '</div>' +
      '<div class="help">Edit the <b>TEAM</b> row in L10_Config to change the roster — comma-separated names, matching the Owner column on rocks and to-dos.</div></div>';

  // Notifications + custom digests — the inner content renders from the
  // lazily-fetched settingsData (see fetchSettingsData_ / notifyCardInner_).
  html += '<div class="card" id="card-notify">' + notifyCardInner_() + '</div>';
  html += '<div class="card" id="card-digests">' + digestsCardInner_() + '</div>';

  // Integrations
  html += '<div class="card"><h3>Integrations</h3>' +
      '<div class="row">' +
      setFieldHtml_('set-mgr', 'Stuart\'s email (fuller manager recap after each huddle)', cfg.STUART_EMAIL, 'manager@bradycorp.com', '') +
      setFieldHtml_('set-recapto', 'Extra recap recipients', cfg.RECAP_TO, 'comma-separated emails', '') + '</div>' +
      '<div class="row row--end">' +
      '<div class="field f-2">' + '<label>Email automation triggers</label>' +
        '<div class="help mt-0">Status: <b id="set-mail-status">checking…</b> — heads-up the day before, recaps after, prep packs each morning.</div></div>' +
      '<button class="btn subtle mb-3" id="set-mail-install">Install / refresh email triggers</button></div>' +
      setFieldHtml_('set-chat', 'Google Chat webhook (to-do pings)', cfg.CHAT_WEBHOOK_URL, 'https://chat.googleapis.com/v1/spaces/…', 'In the space: Apps &amp; integrations → Webhooks → Add, then paste the URL. Blank = off.') +
      setFieldHtml_('set-ga4', 'Google Analytics property ID (GA4 scorecard metrics)', cfg.GA4_PROPERTY_ID, 'e.g. 123456789', 'The digits from Google Analytics → Admin → Property settings (a pasted "properties/123456789" works too). Metrics with the Google Analytics source read the property with each viewer\'s own sign-in — read-only, no keys or tokens stored. Blank = off.') +
      '<div class="row">' +
      setFieldHtml_('set-jira-domain', 'Jira domain', cfg.JIRA_DOMAIN, 'yourco.atlassian.net', '') +
      setFieldHtml_('set-jira-project', 'Jira project key', cfg.JIRA_PROJECT_KEY, 'OPS', '') +
      setFieldHtml_('set-jira-email', 'Jira account email', cfg.JIRA_EMAIL, 'you@company.com', '') + '</div>' +
      '<div class="row row--end">' +
      '<div class="field f-2"><label>Jira API token (<span id="set-jira-status">checking…</span>)</label>' +
        '<input id="set-jira-token" type="password" placeholder="paste a token to set it — blank leaves it unchanged"></div>' +
      '<button class="btn subtle mb-3" id="set-jira-save-token">Save token</button></div>' +
      '<button class="btn" id="set-save-integrations">Save integration settings</button></div>';

  // Team access link (phones + laptops without the sheet open)
  html += '<div class="card"><h3>Team access link</h3>' +
      '<p class="help mt-0">Sheets\' mobile apps can\'t open add-on dialogs — but this app also runs as a plain web page, which works great in a phone browser. Deploy once, share the link with the team.</p>' +
      '<div id="set-weblink"><span class="muted">checking…</span></div></div>';


  page.innerHTML = html;

  // ---- wiring ----
  function reSeg_() { $('seg-editor').innerHTML = segRowsHtml_(); wireSegEditor_(); }
  function wireSegEditor_() {
    page.querySelectorAll('[data-segup]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.dataset.segup);
        state.setSegs = segCollect_();
        var t = state.setSegs[i - 1]; state.setSegs[i - 1] = state.setSegs[i]; state.setSegs[i] = t;
        reSeg_();
      });
    });
    page.querySelectorAll('[data-segdown]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var i = Number(btn.dataset.segdown);
        state.setSegs = segCollect_();
        var t = state.setSegs[i + 1]; state.setSegs[i + 1] = state.setSegs[i]; state.setSegs[i] = t;
        reSeg_();
      });
    });
    page.querySelectorAll('[data-segdel]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.setSegs = segCollect_();
        state.setSegs.splice(Number(btn.dataset.segdel), 1);
        reSeg_();
      });
    });
  }
  wireSegEditor_();
  $('seg-add').addEventListener('click', function () {
    state.setSegs = segCollect_();
    state.setSegs.push(['New segment', 5]);
    reSeg_();
  });
  $('set-save-meeting').addEventListener('click', function () {
    var btn = $('set-save-meeting');
    btn.disabled = true;
    var segs = segCollect_();
    gs('l10_saveSettings', {
      meetingName: $('set-name').value, huddleDay: $('set-day').value,
      timerChime: $('set-chime').checked ? 'YES' : 'NO', segments: segs
    }).then(function (res) {
      btn.disabled = false;
      if (!res || !res.ok) { errToast(res || 'Save failed'); return; }
      state.boot.config.MEETING_NAME = $('set-name').value.trim() || 'Paid Media Momentum Huddle';
      state.boot.config.HUDDLE_DAY = $('set-day').value;
      state.boot.config.TIMER_CHIME = $('set-chime').checked ? 'YES' : 'NO';
      state.boot.segments = segs;
      notify('Meeting settings saved', 'ok');
      renderHeader();
      if (!state.inMeeting) renderHuddle();
    }).catch(function (e) { btn.disabled = false; errToast(e); });
  });
  $('set-mail-install').addEventListener('click', function () {
    var btn = $('set-mail-install');
    btn.disabled = true;
    gs('l10_installMailTriggers').then(function (res) {
      btn.disabled = false;
      if (res && res.ok) {
        notify(res.msg || 'Email triggers installed', 'ok', 6000);
        $('set-mail-status').textContent = 'installed';
        if (state.settingsExtra) state.settingsExtra.mailTriggersOn = true;
      } else errToast(res || 'Install failed');
    }).catch(function (e) { btn.disabled = false; errToast(e); });
  });
  $('set-jira-save-token').addEventListener('click', function () {
    var v = $('set-jira-token').value.trim();
    if (!v) { notify('Paste a token first (or manage it from the sheet menu).', 'warn'); return; }
    var btn = $('set-jira-save-token');
    btn.disabled = true;
    gs('l10_setJiraToken', v).then(function () {
      btn.disabled = false;
      $('set-jira-token').value = '';
      $('set-jira-status').textContent = 'set ✓';
      if (state.settingsExtra) state.settingsExtra.jiraTokenSet = true;
      notify('Jira token saved', 'ok');
    }).catch(function (e) { btn.disabled = false; errToast(e); });
  });
  $('set-save-integrations').addEventListener('click', function () {
    var btn = $('set-save-integrations');
    btn.disabled = true;
    var payload = {
      managerEmail: $('set-mgr').value, recapTo: $('set-recapto').value,
      chatWebhookUrl: $('set-chat').value, ga4PropertyId: $('set-ga4').value,
      jiraDomain: $('set-jira-domain').value,
      jiraProjectKey: $('set-jira-project').value, jiraEmail: $('set-jira-email').value
    };
    gs('l10_saveSettings', payload).then(function (res) {
      btn.disabled = false;
      if (!res || !res.ok) { errToast(res || 'Save failed'); return; }
      state.boot.config.STUART_EMAIL = payload.managerEmail.trim();
      state.boot.config.RECAP_TO = payload.recapTo.trim();
      state.boot.config.CHAT_WEBHOOK_URL = payload.chatWebhookUrl.trim();
      // The server normalizes the property ID (strips "properties/", keeps the
      // digits) — splice ITS value back so local state and the field match it.
      state.boot.config.GA4_PROPERTY_ID = (res.config && res.config.GA4_PROPERTY_ID !== undefined)
          ? String(res.config.GA4_PROPERTY_ID) : payload.ga4PropertyId.trim();
      var g4 = $('set-ga4');
      if (g4) g4.value = state.boot.config.GA4_PROPERTY_ID;
      state.boot.config.JIRA_DOMAIN = payload.jiraDomain.trim();
      state.boot.config.JIRA_PROJECT_KEY = payload.jiraProjectKey.trim();
      state.boot.config.JIRA_EMAIL = payload.jiraEmail.trim();
      notify('Integration settings saved', 'ok');
    }).catch(function (e) { btn.disabled = false; errToast(e); });
  });
  wireNotifyDigests_();
  fetchSettingsData_(); // no-op unless the page is visible and the data isn't in yet

  // Async extras (web-app URL, Jira token presence, trigger status). Memoized
  // per session — this used to fire a fresh server execution on EVERY
  // hydRender_ pass (4 per boot) for values that change at most when someone
  // installs triggers or saves a token, and those handlers patch the memo.
  var applyExtras_ = function (st) {
    var ms = $('set-mail-status');
    if (ms) ms.textContent = st.mailTriggersOn ? 'installed' : 'not installed yet';
    var js = $('set-jira-status');
    if (js) js.textContent = st.jiraTokenSet ? 'set ✓' : 'not set';
    var wl = $('set-weblink');
    if (wl) {
      if (st.webAppUrl) {
        wl.innerHTML = '<div class="row row--mid"><span class="mono f-1 wrap-any">' + esc(st.webAppUrl) + '</span>' +
            '<button class="btn mini subtle" id="set-weblink-copy">Copy link</button></div>' +
            '<div class="help">Works in any browser, including phones. Anyone with edit access to this spreadsheet can use it.</div>';
        var cp = $('set-weblink-copy');
        if (cp) cp.addEventListener('click', function () { copyText(st.webAppUrl, 'Team link'); });
      } else {
        wl.innerHTML = '<div class="help mt-0">Not deployed yet. In the Apps Script editor: <b>Deploy → New deployment → Web app</b> (execute as you, access: anyone in your team\'s domain), then reopen Settings — the link shows here.</div>';
      }
    }
  };
  if (state.settingsExtra) {
    applyExtras_(state.settingsExtra);
  } else if (!state.settingsExtraInflight) {
    state.settingsExtraInflight = true;
    gs('l10_getSettings').then(function (st) {
      state.settingsExtraInflight = false;
      state.settingsExtra = st;
      applyExtras_(st);
    }).catch(function () {
      state.settingsExtraInflight = false;
      var ms = $('set-mail-status'); if (ms) ms.textContent = '—';
      var js = $('set-jira-status'); if (js) js.textContent = '—';
    });
  }
}

// Make the toast stack a screen-reader live region once, at load — set before
// any toast is appended so the first message is announced. aria-atomic=false so
// only the newly-added toast is read, not the whole stack.
(function () {
  var ns = $('notify-stack');
  if (ns) { ns.setAttribute('role', 'status'); ns.setAttribute('aria-live', 'polite'); ns.setAttribute('aria-atomic', 'false'); }
})();
boot();
</script>
