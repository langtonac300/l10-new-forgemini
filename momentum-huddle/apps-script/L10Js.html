<script>
var state = {
  boot: null, segIdx: 0, segStartedAt: null, timerH: null,
  // Timer pause + view freshness + the capture-grid's selected week.
  segPausedAt: null, loadedAt: 0, capWeek: null,
  segue: {}, ratings: {}, idsFocus: null, idsPath: null, idsJustOpened: false,
  editing: null, drafts: {}, busyN: 0, busyW: 0,
  // Data-source health (v_l10_data_health via l10_dataHealth) — fetched lazily
  // after boot, cached server-side; null = unknown/off and the UI stays quiet.
  health: null,
  // Metrics "off track first" toggle (client-only) + a one-shot flag so the
  // timer announces over-time to screen readers once, not every tick.
  scSortOffFirst: false, segOverAnnounced: false, idsActiveStep: null,
  // Which door the fix leaves through in the Decide step: 'todos' (default),
  // 'rock' (promote to priority), or 'data' (assign homework, revisit).
  idsFix: null,
  // Only true once the user explicitly Starts/Resumes a meeting this session.
  // Opening the app (or reloading) leaves it false so the huddle never
  // auto-launches just because a meeting row is still OPEN.
  inMeeting: false,
  // The issue shown in the read-only context modal (a to-do's "from IS-###"),
  // and the priority shown in its sibling (a resolution's "RK-###").
  ctxIssue: null, ctxRock: null,
  // The in-progress issue voting round: { order, idx, left, issueOrder } or null.
  // Client-side by design — the huddle is driven from one shared screen, and
  // the votes themselves persist to the sheet on every tap.
  voting: null,
  // --- To-dos page working state (all deliberately transient) ---------------
  // The team lives on this page between huddles, so it gets desk-grade controls
  // — but none of them may change what the room sees on the shared screen. That
  // is enforced by construction, not by discipline: this object lives in memory
  // only (never the sheet, never localStorage), the huddle segment doesn't
  // consult it at all, and applyPresent_ wipes it on the way into the room view.
  // Same spirit as lensOwnerOrder_ (which only reorders, never filters).
  todoFilter: { q: '', mine: false, overdue: false, week: false },
  // Ids ticked for a bulk action, and which to-dos have their detail drawer open.
  todoSel: {}, todoOpenDrawer: {}, todoSelectMode: false,
  // The composer's sticky fields. Held in state (not just the DOM) so a
  // re-render restores them: assigning four to-dos to the same person should
  // cost four sentences, not four re-setups of owner + date + repeat.
  todoCompose: { owners: [], due: '', repeat: false, text: '', notes: '' },
  // Whether the composer is expanded past its single line. Sticky once opened —
  // see addTodoCard.
  todoComposeOpen: false
};

// Read-only endpoints: while ONLY these are in flight the chip says
// "Loading…" — "Saving…" is reserved for calls that actually write, so the
// chip stops crying wolf during boot and background refreshes.
var L10_READS_ = { l10_bootCore: 1, l10_bootWork: 1, l10_bootPlan: 1, l10_bootScorecard: 1,
  l10_bootstrap: 1, l10_getSettings: 1, l10_getGuideHtml: 1, l10_webAppUrl: 1,
  l10_calContext: 1, l10_calDay: 1, l10_testRangeRef: 1, l10_ga4Test: 1,
  l10_metricPacks: 1, l10_getNotifyPrefs: 1, l10_getDigests: 1,
  l10_hubCounts: 1, l10_settingsData: 1, l10_dataHealth: 1 };
function busy(delta, isRead) {
  state.busyN = Math.max(0, state.busyN + delta);
  state.busyW = Math.max(0, (state.busyW || 0) + (isRead ? 0 : delta));
  var el = $('sync');
  if (!el) return;
  el.style.display = state.busyN ? 'inline-flex' : 'none';
  el.textContent = state.busyW ? 'Saving…' : 'Loading…';
}

function gs(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  var isRead = !!L10_READS_[fn];
  // Write counter: boot()'s barrier compares it so a write made against
  // snapshot-hydrated state (allowed — writes are id-keyed) triggers one
  // reconcile instead of the in-flight slices visually reverting it.
  if (!isRead) state.writeSeq = (state.writeSeq || 0) + 1;
  busy(1, isRead);
  return new Promise(function (resolve, reject) {
    var runner = google.script.run
        .withSuccessHandler(function (v) { busy(-1, isRead); resolve(v); })
        .withFailureHandler(function (e) { busy(-1, isRead); reject(e); });
    runner[fn].apply(runner, args);
  });
}

function errToast(e) {
  notify('⚠️ ' + ((e && e.message) || (e && e.error) || e || 'Something went wrong — reload and retry.'), 'err');
}

function $(id) { return document.getElementById(id); }
// The one two-click arm shared by every destructive control (window.confirm is
// blocked in the Sheets iframe): first click swaps the label to its own
// confirm and returns false; a second click within ttl restores the label,
// runs fn, and returns true. The timeout disarms silently. opts.danger reddens
// the armed button. The CSS [data-armed] hooks (milestone ✕) keep working —
// the helper uses the same dataset key the sites always used.
function armedConfirm(btn, opts, fn) {
  opts = opts || {};
  if (btn.dataset.armed) {
    delete btn.dataset.armed;
    btn.textContent = btn.dataset.l10Orig || btn.textContent;
    if (opts.danger) btn.classList.remove('danger');
    if (fn) fn();
    return true;
  }
  btn.dataset.armed = '1';
  btn.dataset.l10Orig = btn.textContent;
  btn.textContent = opts.label || 'sure? click again';
  if (opts.danger) btn.classList.add('danger');
  setTimeout(function () {
    if (btn.dataset.armed) {
      delete btn.dataset.armed;
      btn.textContent = btn.dataset.l10Orig;
      if (opts.danger) btn.classList.remove('danger');
    }
  }, opts.ttl || 5000);
  return false;
}
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
// Escape text while making pasted URLs tappable — practitioners live in
// campaign/dashboard links. Every non-URL part goes through esc() (and the
// URL again for the attribute), so this is exactly as XSS-safe as esc().
function linkify(s) {
  s = String(s === undefined || s === null ? '' : s);
  var out = '', last = 0, re = /https?:\/\/[^\s<>"')\]]+/g, m;
  while ((m = re.exec(s))) {
    var shown = m[0].replace(/^https?:\/\//, '');
    if (shown.length > 42) shown = shown.slice(0, 41) + '…';
    out += esc(s.slice(last, m.index)) +
        '<a class="notelink" href="' + esc(m[0]) + '" target="_blank" rel="noopener">' + esc(shown) + '</a>';
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

// --- Component render helpers ----------------------------------------------
// The markup vocabulary, defined once: btnH_/pillH_/fieldH_/cardH_ return
// class-driven markup with no inline styles. Attribute VALUES are escaped
// here; esc() deliberately doesn't escape single quotes, so attributes are
// always double-quoted — attrs_ guarantees that. `inner`/label arguments are
// HTML (callers keep their own esc() discipline on text).
function attrs_(map) {
  var out = '';
  if (!map) return out;
  Object.keys(map).forEach(function (k) {
    var v = map[k];
    if (v === null || v === undefined || v === false) return;
    out += ' ' + k + (v === true ? '' : '="' + esc(String(v)) + '"');
  });
  return out;
}
// cls: everything after "btn " ('mini subtle', 'ghost', '' for the solid
// default). at: attribute map (data-*, title, aria-*, id, disabled…).
function btnH_(cls, label, at) {
  return '<button type="button" class="btn' + (cls ? ' ' + cls : '') + '"' + attrs_(at) + '>' + label + '</button>';
}
function pillH_(mods, inner, at) {
  return '<span class="pill' + (mods ? ' ' + mods : '') + '"' + attrs_(at) + '>' + inner + '</span>';
}
function fieldH_(mods, inner, at) {
  return '<div class="field' + (mods ? ' ' + mods : '') + '"' + attrs_(at) + '>' + inner + '</div>';
}
function cardH_(mods, inner, at) {
  return '<div class="card' + (mods ? ' ' + mods : '') + '"' + attrs_(at) + '>' + inner + '</div>';
}
// Top-right notification stack: every action confirms loudly.
// kind: 'ok' (green, the action really landed in the sheet), 'warn' (amber,
// validation nudge), 'err' (red), 'info' (neutral).
// undo (optional): { fn, label } — renders an Undo button and lets the toast
// linger so a mid-meeting mis-click can be reversed in one click.
function notify(msg, kind, ms, undo) {
  var stack = $('notify-stack');
  if (!stack) return;
  var n = document.createElement('div');
  n.className = 'notif ' + (kind || 'info');
  var msgEl = document.createElement('span');
  msgEl.className = 'nmsg';
  msgEl.textContent = msg;
  n.appendChild(msgEl);
  var dismiss = function () {
    clearTimeout(n.__ttlH);
    n.classList.remove('show');
    setTimeout(function () { if (n.parentNode) n.parentNode.removeChild(n); }, 300);
  };
  if (undo && typeof undo.fn === 'function') {
    var ub = document.createElement('button');
    ub.className = 'undo';
    ub.type = 'button';
    ub.textContent = undo.label || 'Undo';
    ub.addEventListener('click', function () { dismiss(); undo.fn(); });
    n.appendChild(ub);
  }
  stack.appendChild(n);
  requestAnimationFrame(function () { n.classList.add('show'); });
  var ttl = ms || (undo ? 8000 : kind === 'err' ? 7000 : kind === 'warn' ? 5000 : 3500);
  n.__ttlH = setTimeout(dismiss, ttl);
  // Keep more on screen when an Undo is live so it can't scroll off instantly.
  var cap = undo ? 7 : 5;
  while (stack.children.length > cap) stack.removeChild(stack.firstChild);
}
function notifyUndo(msg, undoFn, label) {
  notify(msg, 'ok', 8000, { fn: undoFn, label: label || 'Undo' });
}
function toast(msg) { notify(msg, 'info'); }
function d10(v) {
  var s = String(v === undefined || v === null ? '' : v);
  return /^\d{4}-\d{2}-\d{2}/.test(s) ? s.slice(0, 10) : s;
}
// Local-timezone dates (never toISOString — that's UTC and flips to tomorrow
// during evening meetings in US timezones).
function fmtLocal(d) {
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function localToday() { return fmtLocal(new Date()); }
function localDaysAgo(n) {
  var d = new Date();
  d.setDate(d.getDate() - n);
  return fmtLocal(d);
}
function localDaysAhead(n) { return localDaysAgo(-n); }
// Next Monday — the huddle's own anchor, and what a blank due date already
// means (see l10_addTodo). The snooze control offers it by name for that reason.
function localNextMonday() {
  var d = new Date();
  d.setDate(d.getDate() + ((8 - d.getDay()) % 7 || 7));
  return fmtLocal(d);
}
// Copy: execCommand first (synchronous, works inside the user gesture in the
// sandboxed iframe), async clipboard as backup; never claim success on failure.
function copyText(text, label) {
  var ok = false;
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.left = '0';
  ta.style.width = '10px'; ta.style.height = '10px'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (ok) { notify((label || 'Text') + ' copied', 'ok'); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function () {
      notify((label || 'Text') + ' copied', 'ok');
    }, function () {
      notify('Copy blocked by the browser — select the text and press Ctrl+C.', 'err');
    });
  } else {
    notify('Copy blocked by the browser — select the text and press Ctrl+C.', 'err');
  }
}

var PALETTE = ['#0a58c4', '#d97706', '#0d9488', '#7c3aed', '#db2777', '#65a30d', '#dc2626', '#0284c7'];
function personColor(name) {
  var s = String(name || '');
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return PALETTE[h % PALETTE.length];
}
function avatar(name) {
  var init = String(name || '?').trim().slice(0, 1).toUpperCase();
  return '<span class="avatar" style="background:' + personColor(name) + '">' + esc(init) + '</span>';
}
function who(name) {
  return name ? '<span class="who">' + avatar(name) + esc(name) + '</span>' : '<span class="muted">—</span>';
}
// Metrics owner — a prominent pill (bigger avatar + bold name). Kept separate
// from who() so priorities/to-dos keep their lighter style.
function whoChip(name) {
  return name ? '<span class="who-chip">' + avatar(name) + esc(name) + '</span>' : '<span class="muted">—</span>';
}
// Metrics caveat as a focus-reachable disclosure: a real <button> toggles the
// companion caveatLine() (kept lean — collapsed until used), so the data caveat
// is keyboard- and screen-reader-reachable instead of a hover-only tooltip.
function caveatTip(c, label) {
  c = String(c || '').trim();
  return c ? ' <button type="button" class="cv-i" aria-expanded="false" aria-label="' + esc(label || 'Show data caveat') + '">ⓘ</button>' : '';
}
// The always-in-DOM caveat text the ⓘ reveals (hidden until toggled; forced open
// in present mode via CSS). Lives next to its ⓘ in the same cell — wired by
// wireCaveats() via DOM traversal so no per-cell id is needed (SPA-safe).
function caveatLine(c) {
  c = String(c || '').trim();
  return c ? '<div class="sc-cv-line" hidden>' + esc(c) + '</div>' : '';
}
// Toggle a ⓘ button's companion caveat line (the .sc-cv-line in its own cell).
function wireCaveats(scope) {
  scope.querySelectorAll('button.cv-i').forEach(function (btn) {
    if (btn.__cvWired) return;
    btn.__cvWired = true;
    btn.addEventListener('click', function () {
      var cell = btn.closest('td') || btn.parentElement;
      var line = cell ? cell.querySelector('.sc-cv-line') : null;
      if (!line) return;
      var willOpen = line.hasAttribute('hidden');
      if (willOpen) line.removeAttribute('hidden'); else line.setAttribute('hidden', '');
      btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
    });
  });
}
function tagList(csv, cls) {
  return String(csv || '').split(',').map(function (t) { return t.trim(); }).filter(String)
      .map(function (t) { return '<span class="tag ' + cls + '">' + esc(t) + '</span>'; }).join('');
}
function fmtVal(v, fmt) {
  if (v === null || v === undefined || v === '' || !isFinite(Number(v))) return '—';
  var n = Number(v);
  if (fmt === 'usd') return '$' + n.toLocaleString(undefined, { maximumFractionDigits: 0 });
  if (fmt === 'pct') return n.toLocaleString(undefined, { maximumFractionDigits: 1 }) + '%';
  if (fmt === 'x') return n.toFixed(2) + 'x';
  return n.toLocaleString(undefined, { maximumFractionDigits: 1 });
}
// On/off-track per the metric's rule. Returns 'on', 'off', or null (no judgment).
function ruleCheck(def, v) {
  if (v === null || v === undefined || v === '' || !isFinite(Number(v))) return null;
  var n = Number(v), g = Number(def['Goal']), g2 = Number(def['Goal 2']);
  var rule = String(def['Rule']);
  if (rule === '>=' && isFinite(g)) return n >= g ? 'on' : 'off';
  if (rule === '<=' && isFinite(g)) return n <= g ? 'on' : 'off';
  if (rule === 'between' && isFinite(g) && isFinite(g2)) return (n >= g && n <= g2) ? 'on' : 'off';
  return null;
}
function goalLabel(def) {
  var rule = String(def['Rule']);
  if (rule === 'between') return fmtVal(def['Goal'], def['Format']) + '–' + fmtVal(def['Goal 2'], def['Format']);
  if (rule === '>=' || rule === '<=') return rule + ' ' + fmtVal(def['Goal'], def['Format']);
  return '—';
}
// Status → token color (line/area/dot inherit it via currentColor). 'off' red,
// 'on' green, anything unjudged falls back to the brand accent.
function sparkColor_(status) {
  return status === 'off' ? 'var(--bad)' : status === 'on' ? 'var(--good)' : 'var(--accent)';
}
// Honest sparkline: the y-domain spans the data UNION the goal line(s) (so a 2%
// wobble and a 200% blowout no longer fill the same box), a dashed goal line (a
// band when the rule is "between") rides under a status-colored line + faint
// area, the latest point gets a filled dot, and nulls leave a visible GAP
// (one fixed x-slot per week) instead of compressing the line.
// opts: { goal, goal2, rule, status, chart }.
function sparkline(vals, w, h, opts) {
  opts = opts || {};
  var pad = 3, innerW = w - pad * 2, innerH = h - pad * 2;
  var nums = vals.map(function (v) {
    return (v === '' || v === null || v === undefined || !isFinite(Number(v))) ? null : Number(v);
  });
  var present = nums.filter(function (v) { return v !== null; });
  if (present.length < 1) return '';
  var lo = Math.min.apply(null, present), hi = Math.max.apply(null, present);
  var g = (opts.goal !== undefined && opts.goal !== '' && isFinite(Number(opts.goal))) ? Number(opts.goal) : null;
  // g2 (the band's upper bound) is inert unless the lower goal is also present —
  // matches ruleCheck(), which treats a 'between' metric with a missing Goal as
  // unjudged. Without this, a blank Goal makes Math.min(null, g2) coerce to 0 and
  // the band would anchor at a fabricated 0.
  var g2 = (g !== null && opts.goal2 !== undefined && opts.goal2 !== '' && isFinite(Number(opts.goal2)) && opts.rule === 'between') ? Number(opts.goal2) : null;
  if (g !== null) { lo = Math.min(lo, g); hi = Math.max(hi, g); }
  if (g2 !== null) { lo = Math.min(lo, g2); hi = Math.max(hi, g2); }
  var span = (hi - lo) || 1;
  var n = nums.length;
  function X(i) { return n > 1 ? pad + (i / (n - 1)) * innerW : pad + innerW / 2; }
  function Y(v) { return pad + innerH - ((v - lo) / span) * innerH; }
  // Nulls split the line into separate segments → visible gaps, not skips.
  var segs = [], cur = [];
  nums.forEach(function (v, i) {
    if (v === null) { if (cur.length) { segs.push(cur); cur = []; } return; }
    cur.push(X(i).toFixed(1) + ',' + Y(v).toFixed(1));
  });
  if (cur.length) segs.push(cur);
  var color = sparkColor_(opts.status);
  var sw = opts.chart ? 2 : 1.6, r = opts.chart ? 3.2 : 2.2;
  var svg = '<svg class="spark' + (opts.chart ? ' chart' : '') + '" width="' + w + '" height="' + h +
      '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" style="color:' + color + '">';
  if (g2 !== null) {
    var yA = Y(Math.max(g, g2)), yB = Y(Math.min(g, g2));
    svg += '<rect class="spark-band" x="' + pad + '" y="' + yA.toFixed(1) + '" width="' + innerW + '" height="' + Math.max(0, yB - yA).toFixed(1) + '"/>';
  }
  if (g !== null) {
    svg += '<line class="spark-goal" x1="' + pad + '" y1="' + Y(g).toFixed(1) + '" x2="' + (w - pad) + '" y2="' + Y(g).toFixed(1) + '"/>';
  }
  segs.forEach(function (s) {
    if (s.length < 2) return;
    var x0 = s[0].split(',')[0], x1 = s[s.length - 1].split(',')[0];
    svg += '<polygon class="spark-area" points="' + x0 + ',' + (h - pad) + ' ' + s.join(' ') + ' ' + x1 + ',' + (h - pad) + '"/>';
  });
  segs.forEach(function (s) {
    svg += '<polyline class="spark-line" stroke-width="' + sw + '" points="' + s.join(' ') + '"/>';
  });
  var li = -1;
  for (var i = n - 1; i >= 0; i--) { if (nums[i] !== null) { li = i; break; } }
  if (li >= 0) svg += '<circle class="spark-dot" r="' + r + '" cx="' + X(li).toFixed(1) + '" cy="' + Y(nums[li]).toFixed(1) + '"/>';
  return svg + '</svg>';
}
function findRow(arr, key, id) {
  return arr.filter(function (r) { return String(r[key]) === String(id); })[0] || null;
}

// ---------------------------------------------------------------------------
// "My lens" — a per-browser viewer identity (the deployed app can't know who
// clicked, so this is a self-set chip, remembered locally). It only reorders
// lists (your things first) and pre-selects your 1:1 page — never a data filter,
// so the room view on the shared screen is identical for everyone.
// ---------------------------------------------------------------------------
function lensGet_() {
  try { return localStorage.getItem('l10Lens') || ''; } catch (e) { return ''; }
}
function lensSet_(name) {
  try { if (name) localStorage.setItem('l10Lens', name); else localStorage.removeItem('l10Lens'); } catch (e) {}
}
// Owner-group ordering with the lens holder first (then the roster order, then
// anyone off-roster, then unassigned "—").
function lensOwnerOrder_(names) {
  var lens = lensGet_();
  var team = state.boot ? state.boot.team : [];
  return names.slice().sort(function (a, b) {
    function rank(n) {
      if (lens && n === lens) return -1;
      var i = team.indexOf(n);
      if (i !== -1) return i;
      return n === '—' ? 999 : 500;
    }
    return rank(a) - rank(b) || (a < b ? -1 : 1);
  });
}

// ---------------------------------------------------------------------------
// Pre-huddle brief + analysis playbook + decision memory.
// The brief arrives in the L10_Brief tab (intake endpoint or hand-typed): a
// ranked "what deserves Solve time" docket plus context strips, evidence and
// caveats already attached. The playbook + past issues power type-time
// suggestions ("this has a standing report" / "we've seen this before").
// ---------------------------------------------------------------------------
function briefOn_() {
  var b = state.boot;
  return b && String(b.config.BRIEF_ENABLED || 'YES').toUpperCase() !== 'NO' && (b.brief || []).length > 0;
}
function briefRows_(section) {
  return (state.boot.brief || []).filter(function (r) { return String(r['Section']) === section; });
}
function briefDollars_(v) {
  return (v !== '' && v !== null && v !== undefined && isFinite(Number(v)))
      ? '<span class="tag acct" title="directional dollars at stake — see the caveat">~$' + Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 }) + '</span>' : '';
}
// The docket card. compact=true (Solve segment) lists only unpromoted items.
function briefDocketHtml(compact) {
  var items = briefRows_('DOCKET');
  if (compact) items = items.filter(function (r) { return !String(r['Promoted To'] || '').trim(); });
  if (!items.length) return '';
  var last = '';
  (state.boot.brief || []).forEach(function (r) {
    if (String(r['Received At']) > last) last = String(r['Received At']);
  });
  var html = '<div class="card"><h3>This week — what deserves Solve time' +
      (compact ? '' : ' <span class="h3-sub">ranked; promote what the room agrees to take up</span>') + '</h3>';
  items.forEach(function (r) {
    var promoted = String(r['Promoted To'] || '').trim();
    html += '<div class="itemline"><span class="tag cat" title="docket rank">#' + esc(r['Rank']) + '</span>' +
        '<div class="grow"><div class="t">' + esc(r['Title']) + caveatTip(r['Caveat']) + caveatLine(r['Caveat']) + '</div>' +
        (compact ? '' : '<div class="m">' + esc(r['Body'] || '') + '</div>') +
        '<div class="m">' + briefDollars_(r['Dollars At Stake']) + tagList(r['Accounts'], 'acct') +
        (r['Playbook Ref'] ? ' <span class="tag shift" title="a standing report answers this — details land in the issue when promoted">' + esc(r['Playbook Ref']) + '</span>' : '') + '</div></div>' +
        (promoted
          ? '<span class="pill-status ps-done">→ ' + esc(promoted) + '</span>'
          : '<button class="btn mini ghost" data-promote="' + esc(r['Rank']) + '">↓ to issues</button>') +
        '</div>';
  });
  html += '<div class="help">Numbers here are directional, from the latest data snapshot' +
      (last ? ' (received ' + esc(last) + ')' : '') + ' — the metrics capture stays the number of record.</div></div>';

// ---------------------------------------------------------------------------
// Huddle page
// ---------------------------------------------------------------------------

function renderHuddle() {
  // Opening the app must not auto-launch a meeting — updating to-dos / rocks /
  // issues from the tabs shouldn't start the timed agenda. The meeting view is
  // shown only after an explicit Start/Resume this session; a fresh load (or a
  // reload) lands on the start screen even when a meeting row is still OPEN, and
  // the start screen offers to resume it from there.
  var b = state.boot;
  if (state.inMeeting && b.openMeeting) { renderMeeting(); return; }
  state.inMeeting = false;
  renderStartScreen();
}

function renderStartScreen() {
  var b = state.boot;
  var last = b.lastMeeting;
  var open = b.openMeeting;
  var openToday = open && d10(open['Date']) === b.today;

  // No meeting runs on this screen — kill any stray timer from a prior view
  // (e.g. after concluding or discarding) so it can't tick in the background,
  // and drop any voting round left over from a concluded/discarded huddle.
  clearInterval(state.timerH);
  state.voting = null;

  var html = '<h2 class="page-title">Ready to huddle?</h2>' +
      '<p class="page-sub">Opening the app doesn\'t start a meeting — use the tabs above to update to-dos, ' +
      'rocks or issues any time. The timed agenda only runs once you start it here.</p>';

  // First run: until the first huddle has concluded, the start screen leads
  // with a short setup checklist instead of assuming the workspace is live.
  // Ticks derive from the data itself, so this card retires on its own.
  if (hyd('work') && hyd('plan') && hyd('scorecard') && !b.history.length && !openToday) {
    var frDefs = ((b.scorecard || {}).defs || []).filter(function (d) { return String(d['Active']).toUpperCase() !== 'NO'; }).length;
    var frRocks = (b.rocks || []).filter(function (r) { return r['Status'] !== 'DROPPED' && r['Status'] !== 'DONE'; }).length;
    var frRow = function (done, label, btnLabel, fr) {
      return '<div class="itemline"><span class="fr-mark' + (done ? ' ok' : '') + '" aria-hidden="true">' + (done ? '✓' : '○') + '</span>' +
          '<div class="grow"><div class="t">' + label + '</div></div>' +
          (done ? '<span class="pill pill--good">done</span>' : btnH_('mini subtle', btnLabel, { 'data-fr': fr })) +
          '</div>';
    };
    html += '<div class="card fr-card"><h3>Set up your huddle</h3>' +
        frRow(frDefs > 0, 'Pick the weekly metrics the room reads', 'Open Metrics', 'scorecard') +
        frRow(frRocks > 0, 'Add this quarter\'s priorities (3–7 of them)', 'Open Priorities', 'rocks') +
        frRow(false, 'Two minutes on how a Momentum huddle runs', '? Open the guide', 'guide') +
        '<div class="help">Then pick who\'s in the room below and start your first huddle — the agenda runs itself, and this checklist retires once the first one wraps up.</div></div>';
  }

  // A huddle still OPEN from earlier today: offer to resume it (or discard a
  // stray/test one) instead of silently dropping the room back into it.
  if (openToday) {
    html += '<div class="card resume-card"><h3>▶ Today\'s huddle is still open</h3>' +
        '<p class="page-sub page-sub--tight">' + esc(open['ID']) + ' · started ' + esc(open['Started At']) +
        (open['Attendees'] ? ' · ' + esc(open['Attendees']) : '') + '</p>' +
        '<div class="row"><button class="btn big" id="btn-resume">▶ Resume the huddle</button>' +
        '<button class="btn subtle mini" id="btn-discard-open">discard it (mistake / testing)</button></div>' +
        '<div class="help">Resume picks up the timed agenda where it left off. Discard removes it (it won\'t appear in History).</div></div>';
  } else if (open) {
    html += '<div class="banner warn">A huddle from <b>' + esc(d10(open['Date'])) + '</b> was left open and never ' +
        'concluded — it\'ll be archived automatically when you start a new one below.</div>';
  }

  // Pre-huddle brief: the ranked docket + context strips, so the room walks in
  // already briefed instead of building the issues list from memory.
  if (briefOn_()) html += briefDocketHtml(false) + briefStripsHtml();

  if (last) {
    html += '<div class="tiles">' +
        '<div class="tile"><div class="v">' + esc(last['Todo Done %'] !== '' ? last['Todo Done %'] + '%' : '—') + '</div><div class="l">to-dos done last huddle (target ' + esc(b.config.TODO_DONE_TARGET || 90) + '%)</div></div>' +
        '<div class="tile"><div class="v">' + esc(last['Rating Avg'] !== '' ? last['Rating Avg'] : '—') + '</div><div class="l">last meeting rating /10</div></div>' +
        '<div class="tile"><div class="v">' + esc(last['Issues Solved'] !== '' ? last['Issues Solved'] : '0') + '</div><div class="l">issues solved last huddle</div></div>' +
        '<div class="tile"><div class="v">' + (hyd('work') ? b.issues.filter(function (i) { return i['Status'] === 'OPEN'; }).length : '…') + '</div><div class="l">issues waiting on the list</div></div></div>';
  }

  // Same form as the in-meeting Headlines segment — meetingId_() is '' here, so
  // they land on the Headlines list with a blank Meeting ID and appear in the
  // huddle's Headlines segment. Full list/edit lives on the Headlines tab.

      (hlQueued ? ' (' + hlQueued + ' queued)' : ''));

  html += '<div class="card"><h3>' + (openToday ? 'Or start fresh — who\'s here?' : 'Who\'s here?') + '</h3><div class="row" id="att-row">' +
      b.team.map(function (p) {
        return '<button class="person-chip on" data-name="' + esc(p) + '" aria-pressed="true">' + avatar(p) + esc(p) + '</button>';
      }).join(' ') + '</div>' +
      '<div class="help">Tap a name to mark them out — selected people are solid blue with a ✓.</div>' +
      '<div class="mt-4"><button class="btn big" id="btn-start">▶ Start the huddle</button>' +
      '</div></div>';
  $('page-huddle').innerHTML = html;
  wireHeadlineAdd($('page-huddle'));
  wireBrief($('page-huddle'));
  wireCaveats($('page-huddle'));
  // First-run checklist doors.
  document.querySelectorAll('#page-huddle [data-fr]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      if (btn.dataset.fr === 'guide') openGuide();
      else showPage(btn.dataset.fr);
    });
  });
  document.querySelectorAll('#att-row .person-chip').forEach(function (c) {
    c.addEventListener('click', function () { c.setAttribute('aria-pressed', c.classList.toggle('on') ? 'true' : 'false'); });

  // Resume: re-enter the existing open meeting without re-picking the room.
  var resume = $('btn-resume');
  if (resume) resume.addEventListener('click', function () {
    state.inMeeting = true;
    state.segIdx = 0; state.segStartedAt = null;
    renderMeeting();
  });

  // Discard a stray/test open meeting straight from the start screen.
  var discard = $('btn-discard-open');
  if (discard) discard.addEventListener('click', function () {
    armedConfirm(discard, { label: 'really discard? click again', danger: true }, function () {
      discard.disabled = true;
      gs('l10_cancelMeeting', String(open['ID'])).then(function (res) {
        if (!res || !res.ok) { discard.disabled = false; errToast(res || 'Discard failed'); return; }
        notify('Open huddle discarded — it won\'t appear in History.', 'ok');
        state.inMeeting = false;
        state.segue = {}; state.ratings = {}; state.drafts = {};
        // Splice: CANCELLED rows appear nowhere — drop the local row and
        // repaint the start screen; no full reboot needed.
        state.boot.openMeeting = null;
        state.segIdx = 0;
        renderHuddle();
      }).catch(function (e) { discard.disabled = false; errToast(e); });
    });
  });

  $('btn-start').addEventListener('click', function () {
    var attendees = [];
    document.querySelectorAll('#att-row .person-chip.on').forEach(function (c) { attendees.push(c.dataset.name); });
    if (!attendees.length) { notify('Pick at least one attendee.', 'warn'); return; }
    var btn = $('btn-start');
    btn.disabled = true;
    state.inMeeting = true;
    gs('l10_startMeeting', attendees).then(function (res) {
      notify(res && res.resumed ? 'Resumed today\'s open huddle' : 'Huddle started', 'ok');
      state.segue = {}; state.ratings = {}; state.drafts = {};
      // Splice: the server returns the meeting row, and every other slice is
      // already on hand — paint the first segment NOW instead of re-booting
      // the entire app (4 fresh server executions between click and clock).
      // state.loadedAt is 0 until the LIVE slice barrier resolves — snapshot
      // hydration sets the hyd flags from last session's data, and a huddle
      // must never start on that (nor have the arriving slices repaint the
      // live segment out from under the room's typing).
      if (res && res.row && state.loadedAt && hyd('core') && hyd('work') && hyd('plan') && hyd('scorecard')) {
        state.boot.openMeeting = res.row;
        // A resumed meeting brings its saved segue notes back with it.
        if (res.resumed && res.row['Segue (JSON)']) {
          try { state.segue = JSON.parse(res.row['Segue (JSON)']) || {}; } catch (e) {}
        }
        startSegment(0);
        return;
      }

      // full reload is the safe path.
      return boot().then(function () { startSegment(0); });
    }).catch(function (e) {

}

function attendees_() {
  return String(state.boot.openMeeting['Attendees'] || '').split(',')
      .map(function (s) { return s.trim(); }).filter(String);
}

function renderMeeting() {
  var b = state.boot;
  var segs = b.segments;
  var isLast = state.segIdx >= segs.length - 1;
  var html = '<h2 class="page-title">Huddle in progress <span class="muted txt-sub">' +
      esc(b.openMeeting['ID']) + ' · started ' + esc(b.openMeeting['Started At']) + '</span></h2>';
  html += '<div class="segrail">' + segs.map(function (s, i) {
    var cls = i === state.segIdx ? 'cur' : (i < state.segIdx ? 'done' : '');
    return '<button class="' + cls + '" data-i="' + i + '"><span class="sn">' + esc(s[0]) + '</span><span class="sm">' + s[1] + ' min</span></button>';
  }).join('') + '</div>';
  html += '<div class="timerbar"><div class="timer" id="seg-timer">--:--</div>' +
      '<span id="seg-timer-live" class="sr-only" aria-live="polite"></span>' +
      '<button class="btn subtle" id="btn-pause" title="Pause the segment clock (interruptions happen)">' +
        (state.segPausedAt ? '▶ Resume' : '⏸ Pause') + '</button>' +
      '<button class="btn subtle" id="btn-timer-reset" title="Restart this segment\'s clock from the top" aria-label="Restart this segment\'s clock">↺</button>' +
      '<div class="t-track"><div class="t-fill" id="seg-fill" style="width:0%"></div></div>' +
      (isLast ? '' :
        '<button class="btn ghost" id="btn-next">Next →</button>' +
        '<button class="btn subtle" id="btn-jump-conclude" title="Jump to the Wrap-up segment">⏭ Wrap-up</button>') +
      '<button class="btn subtle" id="btn-present" title="Full-screen room mode for the shared screen">⛶ Present</button>' + '</div>';
  html += '<div id="seg-body"></div>';
  $('page-huddle').innerHTML = html;
  document.querySelectorAll('.segrail button').forEach(function (btn) {
    btn.addEventListener('click', function () { startSegment(Number(btn.dataset.i)); });
  });
  var next = $('btn-next');
  if (next) next.addEventListener('click', function () { startSegment(state.segIdx + 1); });
  var jump = $('btn-jump-conclude');
  if (jump) jump.addEventListener('click', function () { startSegment(segs.length - 1); });
  var pres = $('btn-present');
  if (pres) pres.addEventListener('click', togglePresent);
  var pause = $('btn-pause');
  if (pause) pause.addEventListener('click', togglePause_);
  var treset = $('btn-timer-reset');
  if (treset) treset.addEventListener('click', function () {
    // Restart the clock only — the segment's content and any paused state's
    // truthfulness reset together (a reset is a deliberate fresh start).
    state.segStartedAt = Date.now();
    state.segPausedAt = null;
    state.segOverAnnounced = false;
    var b = $('btn-pause');
    if (b) b.textContent = '⏸ Pause';
    clearInterval(state.timerH);
    state.timerH = setInterval(tickTimer, 1000);
    tickTimer();
  });
  if (!state.segStartedAt) { state.segStartedAt = Date.now(); state.segOverAnnounced = false; }
  renderSegment();
  tickTimer();
  clearInterval(state.timerH);
  if (!state.segPausedAt) state.timerH = setInterval(tickTimer, 1000);
}

// Pause/resume the segment clock. Pausing freezes the display; resuming shifts
// the segment start forward by the paused span, so no time is silently lost.
function togglePause_() {
  if (state.segPausedAt) {
    state.segStartedAt += Date.now() - state.segPausedAt;
    state.segPausedAt = null;
    clearInterval(state.timerH);
    state.timerH = setInterval(tickTimer, 1000);
  } else {
    state.segPausedAt = Date.now();
    clearInterval(state.timerH);
  }
  var b = $('btn-pause');
  if (b) b.textContent = state.segPausedAt ? '▶ Resume' : '⏸ Pause';
  tickTimer();
}

// A soft two-note chime when a segment first goes over (config TIMER_CHIME;
// visual pulse stays regardless). WebAudio needs a prior user gesture — the
// meeting was started by one, and any failure is swallowed.
function l10Chime_() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!window.__l10Audio) window.__l10Audio = new Ctx();
    var ctx = window.__l10Audio;
    if (ctx.state === 'suspended') ctx.resume();
    [[880, 0], [660, 0.22]].forEach(function (n) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = n[0];
      g.gain.setValueAtTime(0.0001, ctx.currentTime + n[1]);
      g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + n[1] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n[1] + 0.4);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + n[1]); o.stop(ctx.currentTime + n[1] + 0.45);
    });
  } catch (e) {}
}

function startSegment(i) {
  saveSegueIfAny_();
  state.segIdx = i;
  state.segStartedAt = Date.now();
  state.segPausedAt = null;
  state.segOverAnnounced = false;
  renderMeeting();
}

function tickTimer() {
  var b = state.boot;
  if (!b || !b.openMeeting || !$('seg-timer')) return;
  var mins = Number(b.segments[state.segIdx][1]) || 5;
  var now = state.segPausedAt || Date.now();
  var elapsed = Math.floor((now - state.segStartedAt) / 1000);
  var remain = mins * 60 - elapsed;
  var over = remain < 0;
  var t = Math.abs(remain);
  var mm = Math.floor(t / 60), ss = ('0' + (t % 60)).slice(-2);
  var el = $('seg-timer');
  el.textContent = (over ? '+' : '') + mm + ':' + ss;
  el.classList.toggle('over', over);
  // Announce over-time to screen readers ONCE (the timer ticks every second —
  // mirroring it into a live region would flood the buffer).
  if (over && !state.segOverAnnounced) {
    state.segOverAnnounced = true;
    var live = $('seg-timer-live');
    if (live) live.textContent = 'Segment time is up — now over by ' + mm + ':' + ss + '.';
    if (String((b.config || {}).TIMER_CHIME || 'YES').toUpperCase() !== 'NO') l10Chime_();
  }
  var fill = $('seg-fill');
  fill.style.width = Math.min(100, elapsed / (mins * 60) * 100) + '%';
  fill.classList.toggle('over', over);
}

function renderSegment() {
  var body = $('seg-body');
  if (!body || !state.boot.openMeeting) return;
  if (!hyd('work') || !hyd('plan') || !hyd('scorecard')) {
    body.innerHTML = '<div class="spinner">Loading the room…</div>';
    return;
  }
  // Segment names come from config and are user-editable — match them
  // tolerantly (substring, case-insensitive, with common synonyms) so a
  // renamed segment still lands on the right renderer. Anything unmatched
  // falls through to the Wrap-up renderer, the agenda's last segment.
  var name = String(state.boot.segments[state.segIdx][0] || '');
  if (/check|segue/i.test(name)) body.innerHTML = segSegue();
  else if (/scorecard|metric|number/i.test(name)) body.innerHTML = segScorecard();
  else if (/priorit|rock/i.test(name)) body.innerHTML = segRocks();
  else if (/headline/i.test(name)) body.innerHTML = segHeadlines();
  else if (/to-?do/i.test(name)) body.innerHTML = segTodos();
  else if (/issue|ids/i.test(name)) body.innerHTML = segIds();
  else body.innerHTML = segConclude();
  wireSegment(body);
  wireCaveats(body);
}

// Milestone-reality nudge: the owner says ON TRACK but the milestones
// disagree — any past due, or most of the runway gone with most of the plan
// still open. One muted line of tension; the status buttons stay the only
// way anything flips.
function rockRealityHtml_(r, ms) {
  if (String(r['Status']) !== 'ON TRACK' || !ms.length) return '';
  var today = localToday();
  var open = ms.filter(function (m) { return String(m['Status']).toUpperCase() !== 'DONE'; });
  var past = open.filter(function (m) { var d = d10(m['Due']); return d && d < today; }).length;
  if (past) {
    return '<div class="rock-nudge">' + past + (past === 1 ? ' milestone' : ' milestones') +
        ' past due — still on track?</div>';
  }
  var start = dayMs_(d10(r['Created']) || today), end = dayMs_(d10(r['Due']));
  if (!isFinite(start) || !isFinite(end) || end <= start) return '';
  var elapsed = (dayMs_(today) - start) / (end - start);
  var doneFrac = (ms.length - open.length) / ms.length;
  if (elapsed >= 0.5 && elapsed <= 1 && elapsed - doneFrac >= 0.4) {
    return '<div class="rock-nudge">' + Math.round(elapsed * 100) + '% of the time gone, ' +
        (ms.length - open.length) + ' of ' + ms.length + ' milestones done — still on track?</div>';
  }
  return '';
}
// Zero-milestone nudge: a priority several weeks old with no plan under it
// gets one quiet prompt. Fainter than the reality nudge on purpose — there's
// no deadline being missed yet, just a plan that hasn't been named.
function rockPlanHintHtml_(r, ms) {
  if (ms.length) return '';
  if (['ON TRACK', 'OFF TRACK'].indexOf(String(r['Status'])) === -1) return '';
  var created = dayMs_(d10(r['Created']));
  if (!isFinite(created)) return '';
  var ageDays = (dayMs_(localToday()) - created) / 86400000;
  if (ageDays < 21) return '';
  return '<div class="rock-hint">No milestones yet — what’s the first thing that must be true?</div>';
}

// --- To-dos segment ---
// --- Inline editing (the ✎ on a line) --------------------------------------
// Fix a typo'd text / wrong owner / wrong date right here instead of hunting
// the row down in the sheet tabs. One line edits at a time (state.editing).

function editingIs(kind, id) {
  return !!state.editing && state.editing.kind === kind && String(state.editing.id) === String(id);
}
// A select that NEVER loses the current value: if it isn't among the options
// (multi-tag CSV, ex-team owner), it's prepended — saving an untouched
// select round-trips the stored value instead of silently rewriting it.
function edSelectHtml_(cls, options, current, blankLabel) {
  var cur = String(current || '');
  var opts = options.slice();
  var h = '<div class="field field--tight"><select class="' + cls + '">';
  if (blankLabel !== undefined) h += '<option value="">' + esc(blankLabel) + '</option>';
  if (cur && opts.indexOf(cur) === -1) h += '<option selected>' + esc(cur) + '</option>';
  h += opts.map(function (o) {
    return '<option' + (cur === o ? ' selected' : '') + '>' + esc(o) + '</option>';
  }).join('') + '</select></div>';
  return h;
}
function cfgList_(key) {
  return String(state.boot.config[key] || '').split(',').map(function (s) { return s.trim(); }).filter(String);
}
// Optional metric link ("the number this should move") — active
// defs only, "none" first and default; a stored id whose metric was retired
// stays selectable so an untouched select round-trips it.
function metricSelectHtml_(cls, current) {
  var defs = ((state.boot.scorecard || {}).defs || []).filter(function (d) {
    return String(d['Active']).toUpperCase() === 'YES';
  }).sort(function (a, b) { return (Number(a['Sort']) || 99) - (Number(b['Sort']) || 99); });
  var cur = String(current || '').trim();
  var h = '<div class="field field--tight"><select class="' + cls +
      '" title="The metric this priority should move (optional) — its 13-week trend shows on the card">' +
      '<option value="">metric it moves…</option>';
  if (cur && !defs.some(function (d) { return String(d['ID']) === cur; })) {
    h += '<option value="' + esc(cur) + '" selected>' + esc(cur) + '</option>';
  }
  h += defs.map(function (d) {
    return '<option value="' + esc(d['ID']) + '"' + (String(d['ID']) === cur ? ' selected' : '') + '>' + esc(d['Metric']) + '</option>';
  }).join('') + '</select></div>';
  return h;
}
function editRowHtml(kind, id, f) {
  var h = '<div class="ed-row"><div class="itemline">' +
      '<div class="field field--tight f-3"><input class="js-ed-text" value="' + esc(f.text || '') + '"></div>';
  if (f.owner !== undefined) h += edSelectHtml_('js-ed-owner', state.boot.team, f.owner);
  if (f.accounts !== undefined) h += edSelectHtml_('js-ed-acct', cfgList_('ACCOUNT_TAGS'), f.accounts, 'tag…');
  if (f.category !== undefined) h += edSelectHtml_('js-ed-cat', cfgList_('ISSUE_CATEGORIES'), f.category, 'category…');
  if (f.due !== undefined) h += '<div class="field field--tight"><input class="js-ed-due" type="date" value="' + esc(f.due || '') + '"></div>';
  // To-dos pass the weekly-repeat flag — unticking here is how a chain ends
  // without dropping the open copy (same label style as the add card).
  if (f.repeat !== undefined) {
    h += '<label class="ck-lbl" ' +
        'title="Weekly repeat: completing this queues next week’s copy. Untick to end the chain."' +
        '><input type="checkbox" class="js-ed-repeat"' + (f.repeat ? ' checked' : '') + '> ↻ weekly</label>';
  }
  h += '<button class="btn mini" data-edsave="' + esc(kind + '|' + id) + '">✓ Save</button>' +
      '<button class="btn mini subtle" data-edcancel="1">cancel</button></div>';
  // Priority extras (only priorities pass these): the definition of done + the
  // linked metric on a second line — both optional, never required.
  if (f.done !== undefined || f.metricId !== undefined) {
    h += '<div class="itemline">';
    if (f.done !== undefined) {
      h += '<div class="field field--tight f-2"><input class="js-ed-done" ' +
          'placeholder="How will you know it’s done? (optional)" value="' + esc(f.done || '') + '"></div>';
    }
    if (f.metricId !== undefined) h += metricSelectHtml_('js-ed-metric', f.metricId);
    h += '</div>';
  }
  // To-dos pass a link/note on a second line — optional, linkified on the row.
  if (f.notes !== undefined) {
    h += '<div class="itemline"><div class="field field--tight f-1"><input class="js-ed-notes" ' +
        'placeholder="link or note (optional)" value="' + esc(f.notes || '') + '"></div></div>';
  }
  return h + '</div>';
}
function editBtnHtml(kind, id) {
  return btnH_('mini subtle', '✎', { 'data-edit': kind + '|' + id, title: 'edit' });
}

// A Source that points at a real issue becomes a tappable reference — the fix
// for "assigned it in 30 seconds during issue solving, zero context a week
// later." One convention across tabs: to-dos and promoted priorities both
// carry it. Anything else (e.g. EMAIL, a metric id) stays the old plain text.
function sourceRefHtml_(src) {
  var s = String(src || '').trim();
  if (!s) return '';
  var iss = /^IS-\d+$/i.test(s) ? findRow(state.boot.issues, 'ID', s) : null;
  if (!iss) return 'from ' + esc(s);
  return '<button type="button" class="srcref" data-issueref="' + esc(s) +
      '" title="' + esc('See the issue this came from: ' + String(iss['Issue']).slice(0, 140)) + '">from ' + esc(s) + ' ↗</button>';
}
// The one "is this still owed?" test. WORKING and BLOCKED are open states.
// Server twin: l10TodoOpen_ (Code.gs) — change one, change both. Anything that
// counts what's outstanding must go through here; a bare Status === 'OPEN'
// comparison drops started and blocked work and inflates the completion score.
var TODO_OPEN_SET = { OPEN: 1, WORKING: 1, BLOCKED: 1 };
function todoOpen_(status) {
  return !!TODO_OPEN_SET[String(status || '').trim().toUpperCase()];
}
// How a status reads on a row. OPEN is the resting state and shows nothing —
// only a deviation earns ink.
var TODO_STATE_META = {
  WORKING: { cls: 'ts-working', label: '◐ working' },
  BLOCKED: { cls: 'ts-blocked', label: '⛔ blocked' }
};
function todoStateTag_(t) {
  var meta = TODO_STATE_META[String(t['Status'] || '').toUpperCase()];
  if (!meta) return '';
  var on = String(t['Blocked On'] || '').trim();
  return ' <span class="tag ' + meta.cls + '"' + (on ? ' title="' + esc('Waiting on: ' + on) + '"' : '') + '>' +
      esc(meta.label) + (on ? ' · ' + esc(on.length > 34 ? on.slice(0, 33) + '…' : on) : '') + '</span>';
}
// How many carry-overs before a to-do stops being treated as a to-do.
function todoStaleAt_() {
  return Number((state.boot.config || {}).TODO_STALE_CARRIES) || 3;
}

// --- Sub-steps + activity trail (children of one to-do) ---------------------
function todoSteps_(id) {
  return (state.boot.todoSteps || []).filter(function (s) { return String(s['Todo ID']) === String(id); });
}
function todoLogFor_(id) {
  return (state.boot.todoLog || []).filter(function (l) { return String(l['Todo ID']) === String(id); })
      .sort(function (a, b) { return String(a['At']) < String(b['At']) ? 1 : -1; });
}

// --- The desk filter --------------------------------------------------------
function todoFilterActive_() {
  var f = state.todoFilter;
  return !!(f.q || f.mine || f.overdue || f.week);
}
// Matches text, notes, owner and id, so "TD-014", "amazon" and "courtney" all
// find the same row without the user having to know which field they're in.
function todoMatches_(t) {
  var f = state.todoFilter;
  if (f.mine) {
    var me = lensGet_();
    // No lens set yet: "Mine" can't mean anything, so it must not silently hide
    // the whole list. It matches nothing and the empty state says why.
    if (!me || String(t['Owner'] || '').trim() !== me) return false;
  }
  var due = d10(t['Due']);
  if (f.overdue && !(due && due < localToday())) return false;
  if (f.week) {
    if (!due) return false;
    if (due > localDaysAhead(7)) return false;
  }
  if (f.q) {
    var hay = [t['To-Do'], t['Notes'], t['Owner'], t['ID'], t['Blocked On']].join(' ').toLowerCase();
    // Every whitespace-separated term must appear (AND, not OR) — typing more
    // words narrows, which is what everyone expects from a search box.
    var terms = f.q.toLowerCase().split(/\s+/).filter(Boolean);
    for (var i = 0; i < terms.length; i++) if (hay.indexOf(terms[i]) === -1) return false;
  }
  return true;
}

// Re-render exactly ONE to-do row in place. Marking something done used to call
// rerenderLists(), which rebuilds six pages with innerHTML: focus was destroyed,
// the list reflowed under the pointer, and any half-typed inline edit elsewhere
// was lost. On the page this team lives in, that cost was paid on every click.
// Returns false when the row isn't on screen (filtered out, other page) so the
// caller can fall back to a full render.
function spliceTodoRow_(id) {
  var t = findRow(state.boot.todos, 'ID', id);
  if (!t) return false;
  var nodes = document.querySelectorAll('[data-todorow="' + String(id).replace(/"/g, '') + '"]');
  if (!nodes.length) return false;
  nodes.forEach(function (node) {
    var withActions = node.dataset.todoactions === '1';
    var doneReview = node.dataset.tododone === '1';
    var holder = document.createElement('div');
    holder.innerHTML = todoLine(t, withActions, doneReview, {
      selectable: node.dataset.todosel === '1',
      hideOwner: node.dataset.tdhideowner === '1'
    });
    var fresh = holder.firstElementChild;
    if (fresh) {
      node.parentNode.replaceChild(fresh, node);
      // Wire the NEW ROW ONLY — never its parent. These wirers bind listeners
      // unconditionally, so re-running them over the whole card would give every
      // untouched sibling a second copy of every handler (one click, two writes).
      wireShared(fresh);
      wireTodoControls(fresh);
    }
  });
  return true;
}
// A to-do row can be on screen TWICE — once in the huddle segment, once on the
// To-dos page — and spliceTodoRow_ rebuilds both. Refocusing by plain selector
// would grab whichever comes first in the document, which is often the hidden
// one. Always resolve inside the visible page.
function focusInVisible_(selector) {
  var page = document.querySelector('.page.visible');
  var el = page && page.querySelector(selector);
  if (el) el.focus();
  return !!el;
}
// Keep the keyboard somewhere sensible after a row disappears from the list:
// the next row's primary action, or the composer when the list just emptied.
function focusAfterTodo_(node) {
  var next = node && node.nextElementSibling;
  var btn = next && next.querySelector('.btn.mini:not(.subtle)');
  if (btn) { btn.focus(); return; }
  focusInVisible_('.js-td-text');
}

// --- Tiny anchored popovers -------------------------------------------------
// window.confirm/prompt are blocked inside the Sheets iframe (see the Wrap-up
// two-click arm), so pickers are built in the DOM. One at a time, closed by
// Escape, a click outside, or a choice — and focus goes into the popover so the
// keyboard can drive it.
function closePop_() {
  var open = document.querySelector('.l10pop');
  if (open) open.parentNode.removeChild(open);
  document.removeEventListener('keydown', popKey_, true);
  document.removeEventListener('mousedown', popOut_, true);
}
function popKey_(ev) { if (ev.key === 'Escape') { ev.stopPropagation(); closePop_(); } }
function popOut_(ev) {
  var pop = document.querySelector('.l10pop');
  if (pop && !pop.contains(ev.target)) closePop_();
}
function mountPop_(anchor, inner) {
  closePop_();
  var pop = document.createElement('div');
  pop.className = 'l10pop';
  pop.innerHTML = inner;
  document.body.appendChild(pop);
  var r = anchor.getBoundingClientRect();
  // Flip up when there isn't room below, so a row near the fold stays usable.
  var below = window.innerHeight - r.bottom;
  var h = pop.offsetHeight;
  pop.style.top = (below < h + 12 ? r.top - h - 6 : r.bottom + 6) + window.scrollY + 'px';
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 12)) + window.scrollX + 'px';
  document.addEventListener('keydown', popKey_, true);
  document.addEventListener('mousedown', popOut_, true);
  return pop;
}
// items: [label, value] pairs.
function openMenu_(anchor, items, cb) {
  var pop = mountPop_(anchor, items.map(function (it) {
    return '<button type="button" class="l10pop-item" data-v="' + esc(it[1]) + '">' + esc(it[0]) + '</button>';
  }).join(''));
  pop.querySelectorAll('.l10pop-item').forEach(function (b) {
    b.addEventListener('click', function () { var v = b.dataset.v; closePop_(); cb(v); });
  });
  var first = pop.querySelector('.l10pop-item');
  if (first) first.focus();
}
function openStatePicker_(anchor, current, cb) {
  var opts = [['○ Open', 'OPEN'], ['◐ Working', 'WORKING'], ['⛔ Blocked', 'BLOCKED']]
      .filter(function (o) { return o[1] !== current; });
  openMenu_(anchor, opts, cb);
}
function promptLine_(anchor, label, initial, cb) {
  var pop = mountPop_(anchor,
      '<label class="l10pop-lbl">' + esc(label) + '</label>' +
      '<input class="l10pop-in" value="' + esc(initial || '') + '">' +
      '<div class="l10pop-row"><button type="button" class="btn mini l10pop-ok">Save</button>' +
      '<button type="button" class="btn mini subtle l10pop-cancel">Cancel</button></div>');
  var input = pop.querySelector('.l10pop-in');
  var done = function () { var v = input.value.trim(); closePop_(); cb(v); };
  pop.querySelector('.l10pop-ok').addEventListener('click', done);
  pop.querySelector('.l10pop-cancel').addEventListener('click', closePop_);
  input.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); done(); } });
  input.focus();
  input.select();
}
// One-row rollback for a failed to-do status write: restores the fields
// setTodoStatus_ touches and repaints just that row (full list pass only when
// the row moved lists). ⚠ Snapshot BEFORE the optimistic call — as an argument
// to serverSync it would evaluate AFTER setTodoStatus_ has already mutated.
function todoStatusSnap_(id) {
  var t = findRow(state.boot.todos, 'ID', id);
  return t ? { s: t['Status'], d: t['Done At'], b: t['Blocked On'] } : null;
}
function todoStatusRevert_(id, snap) {
  return function () {
    if (!snap) return refresh();
    var t = findRow(state.boot.todos, 'ID', id);
    if (!t) return refresh();
    // Same rule as setTodoStatus_'s stillListed check: a revert that crosses
    // the open/done boundary moved the row between lists, and a splice would
    // rebuild it INSIDE the wrong card (an OPEN row stranded under "Done this
    // week", tiles stale) — only a same-list revert may take the narrow path.
    var crossed = todoOpen_(t['Status']) !== todoOpen_(snap.s);
    t['Status'] = snap.s;
    t['Done At'] = snap.d;
    t['Blocked On'] = snap.b;
    if (crossed || !spliceTodoRow_(id)) rerenderLists();
  };
}
// Optimistic date move + the date-only server write.
function setTodoDue_(id, due) {
  var t = findRow(state.boot.todos, 'ID', id);
  var prevDue = t ? t['Due'] : '';
  if (t) {
    t['Due'] = due;
    // The date decides the sort order and the overdue tag, so the row can move
    // or leave the filtered view — a splice alone isn't enough here.
    rerenderLists();
  }
  serverSync(gs('l10_setTodoDue', id, due), 'Due → ' + due, function () {
    var tt = findRow(state.boot.todos, 'ID', id);
    if (tt) { tt['Due'] = prevDue; rerenderLists(); } else refresh();
  });
}

// One order for every to-do list: overdue floats to the top (earliest due
// first), upcoming follows by due date, undated sinks last. The whole method is
// date-driven, so the order IS the feature — no toggle, no control (same move as
// lensOwnerOrder_ one level up).
function sortTodos_(list) {
  return list.slice().sort(function (a, b) {
    var da = d10(a['Due']), db = d10(b['Due']);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return da < db ? -1 : da > db ? 1 : 0;
  });
}
// The Jira sync writes each to-do's ticket key — or an "ERR: …" marker — back
// into the row; surface it so the room can tap through and see failures instead
// of only finding out by opening the sheet. Strictly conditional: nothing shows
// when the column is empty or the sync is off (JIRA_DOMAIN blank).
// The domain normalization below mirrors l10JiraSettings_ (Jira.gs) — keep the
// two chains identical, or the link the room taps and the site the sync posts
// to quietly diverge.
function todoJiraHtml_(t) {
  var raw = String(t['Jira Key'] || '').trim();
  if (!raw) return '';
  var domain = String((state.boot.config || {}).JIRA_DOMAIN || '').trim()
      .replace(/^https?:\/\//, '').replace(/\/.*$/, '');
  if (!domain) return '';
  if (/^ERR:/i.test(raw)) {
    return ' <span class="tag warn" title="' + esc(raw) + '">⚠ Jira sync failed — retries next sync</span>';
  }
  return ' <a class="srcref" href="https://' + esc(domain) + '/browse/' + esc(raw) +
      '" target="_blank" rel="noopener" title="Open ' + esc(raw) + ' in Jira">' + esc(raw) + ' ↗</a>';
}
// One definition of "this week's list". The stats tile, the To-do segment's
// cards, and the Done-this-week card all read this split, so the math can
// never drift between views: review = OPEN and due by today (the huddle asks
// done-or-not-done), upcoming = OPEN but undated or due later, done =
// completed in the trailing 7 days (newest first). Server twin:
// l10_concludeMeeting (Code.gs) runs the same review/done math at wrap-up
// time — change one, change both. Deliberate quirk, kept: an early completion
// counts as done this week even when it was due later — generosity beats
// litigation.
function weekTodos_() {
  var today = localToday();
  var weekAgo = localDaysAgo(7);
  var review = [], upcoming = [], done = [];
  state.boot.todos.forEach(function (t) {
    var status = String(t['Status']).toUpperCase();
    // ⚠ todoOpen_, not status === 'OPEN' — WORKING and BLOCKED are still owed.
    // Dropping them here would shrink the denominator and silently inflate the
    // team's completion score. Server twin: l10_concludeMeeting (Code.gs).
    if (todoOpen_(status)) {
      var due = d10(t['Due']);
      (due && due <= today ? review : upcoming).push(t);
    } else if (status === 'DONE' && d10(t['Done At']) >= weekAgo) {
      done.push(t);
    }
  });
  done.sort(function (a, b) {
    var da = d10(a['Done At']), db = d10(b['Done At']);
    return da < db ? 1 : da > db ? -1 : 0;
  });
  return { review: review, upcoming: upcoming, done: done };
}
// The quiet "Done this week" card — wins don't vanish the instant they're
// checked off. Reopen is the only action; absent when the week has none.
function doneThisWeekCardHtml_() {
  var done = weekTodos_().done;
  if (!done.length) return '';
  return '<div class="card"><h3>Done this week <span class="h3-sub">' + done.length + '</span></h3>' +
      done.map(function (t) { return todoLine(t, false, true); }).join('') + '</div>';
}
// withActions: OPEN rows get the edit/schedule/done/drop cluster. doneReview:
// the muted "Done this week" rendering — reopen is the only action, and the
// urgency tags (overdue/carried/↻) are dropped as noise on already-done work.
// opts (To-dos page only):
//   selectable — draw the bulk-select checkbox. Off everywhere else: a tick-box
//     with no bulk bar next to it is a control that leads nowhere. It is also off
//     by default ON the page until Select mode is on, because a checkbox at the
//     left of a to-do reads as "complete this" to everyone alive, and having it
//     mean "select" next to a separate ✓ done button is a trap.
//   hideOwner — the page groups BY owner, so repeating the name on every row
//     under a header that already says it is pure noise.
function todoLine(t, withActions, doneReview, opts) {
  opts = opts || {};
  var selectable = !!opts.selectable;
  var hideOwner = !!opts.hideOwner;
  if (editingIs('todo', t['ID'])) {
    return editRowHtml('todo', t['ID'], {
      text: t['To-Do'], owner: t['Owner'], due: d10(t['Due']), notes: t['Notes'],
      repeat: String(t['Repeat'] || '').toUpperCase() === 'WEEKLY'
    });
  }
  var id = String(t['ID']);
  var due = d10(t['Due']);
  var open = todoOpen_(t['Status']);
  var late = due && due < localToday() && open;
  var carried = Number(t['Carried Over']) || 0;
  var stale = open && carried >= todoStaleAt_();
  var steps = todoSteps_(id);
  var stepsDone = steps.filter(function (s) { return String(s['Status']).toUpperCase() === 'DONE'; }).length;
  var notes = todoLogFor_(id);
  var drawer = !doneReview && !!state.todoOpenDrawer[id];
  var actions = doneReview ?
      '<button class="btn mini subtle" data-todo="' + esc(id) + '|OPEN" title="Move it back to the open list">↩ reopen</button>' :
    (withActions && open ?
      // Seven buttons on every row is the page's loudest noise. The two that get
      // used constantly stay lit; the rest live in .td-acts, which is transparent
      // at rest and revealed on hover or keyboard focus (:focus-within) — the
      // same reveal the rock rows and milestone ✕ already use. They keep their
      // layout space, so nothing jumps when it appears, and they stay in the tab
      // order the whole time.
      '<span class="td-acts">' +
        todoStateBtnHtml_(t) +
        snoozeBtnHtml_(id) +
        editBtnHtml('todo', id) +
        schedBtnHtml('todo', id) +
        btnH_('mini subtle', 'drop', { 'data-todo': id + '|DROPPED' }) +
      '</span>' +
      drawerBtnHtml_(id, steps, stepsDone, notes, drawer) +
      // Ghost, not solid. A filled accent button is right when there's ONE of it
      // on screen; repeated down every row of a long list it stops reading as
      // emphasis and just becomes weight. It fills in on hover.
      btnH_('mini ghost td-done', '✓ done', { 'data-todo': id + '|DONE' }) :
      '<span class="pill-status ' + (t['Status'] === 'DONE' ? 'ps-ontrack' : 'ps-neutral') + '">' + esc(t['Status']) + '</span>');
  // data-todorow is what spliceTodoRow_ swaps; the two flags let it rebuild the
  // row in the same mode it was rendered in (huddle segment vs page vs done card).
  return '<div class="itemline' + (doneReview ? ' muted' : '') + (stale ? ' td-stale' : '') + '"' +
      ' data-todorow="' + esc(id) + '"' +
      ' data-todoactions="' + (withActions ? '1' : '0') + '"' +
      ' data-todosel="' + (selectable ? '1' : '0') + '"' +
      ' data-tdhideowner="' + (hideOwner ? '1' : '0') + '"' +
      ' data-tododone="' + (doneReview ? '1' : '0') + '">' +
      (selectable && withActions && open && !doneReview ?
        '<input type="checkbox" class="td-check" data-tdsel="' + esc(id) + '"' +
        (state.todoSel[id] ? ' checked' : '') + ' aria-label="' + esc('Select ' + t['To-Do']) + '">' : '') +
      (hideOwner ? '' : '<div class="td-owner-col">' + who(t['Owner']) + '</div>') +
      '<div class="grow"><div class="t">' + esc(t['To-Do']) + '</div>' +
      '<div class="m">' + (doneReview ? 'done ' + esc(d10(t['Done At']) || '—') : 'due ' + esc(due || '—')) +
      (!doneReview ? todoStateTag_(t) : '') +
      (!doneReview && late ? ' <span class="tag stale">overdue</span>' : '') +
      (!doneReview && carried ? ' <span class="tag stale">carried ×' + carried + '</span>' : '') +
      (!doneReview && String(t['Repeat'] || '').toUpperCase() === 'WEEKLY' ? ' <span class="tag" title="Completing this queues next week\'s copy automatically. Dropping it — or unticking ↻ in edit — ends the chain.">↻ weekly</span>' : '') +
      (t['Source'] ? ' · ' + sourceRefHtml_(t['Source']) : '') +
      (t['Notes'] ? ' · ' + linkify(t['Notes']) : '') +
      todoJiraHtml_(t) + '</div>' +
      (stale ? staleNudgeHtml_(t, carried) : '') +
      (drawer ? todoDrawerHtml_(t, steps, notes) : '') +
      '</div>' +
      actions +
      '</div>';
}
// A to-do that has survived N huddles isn't a lazy owner — it's usually work

      // display:none, and focus() on a hidden field is a silent no-op.
      idsOpenStep_(o, step === 'idn' ? 'dsc' : 'sol');
      return;
    }
    if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'b' || ev.key === 'B')) {
      ev.preventDefault();
      var sel = v.slice(s, e);
      if (sel) idsSplice_(ta, s, e, '**' + sel + '**', e + 4);
      else idsSplice_(ta, s, e, '****', s + 2);
      return;
    }
    if (ev.key === 'Tab' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) {
      var ls = v.lastIndexOf('\n', s - 1) + 1;
      if (ev.shiftKey) {
        var lead = (v.slice(ls).match(/^ {1,2}/) || [''])[0];
        if (!lead) return; // nothing to outdent → let Tab move focus (no keyboard trap)
        ev.preventDefault();
        idsSplice_(ta, ls, ls + lead.length, '', Math.max(ls, s - lead.length));
      } else {
        ev.preventDefault();
        idsSplice_(ta, s, e, '  ', s + 2);
      }
      return;
    }
    if (ev.key === 'Enter' && !ev.shiftKey && !ev.ctrlKey && !ev.metaKey) {
      var ls2 = v.lastIndexOf('\n', s - 1) + 1;
      var m = v.slice(ls2, s).match(/^(\s*)([-•])\s+(.*)$/);
      if (m) {
        ev.preventDefault();
        if (m[3] === '') idsSplice_(ta, ls2, s, m[1], ls2 + m[1].length);
        else idsSplice_(ta, s, e, '\n' + m[1] + m[2] + ' ');
      }
    }
  });
}

// --- Issue voting round ------------------------------------------------------
// Structured prioritization for the top of the IDS segment: a random
// attendee goes first, then the round proceeds through the room in turn order
// (wrapping the attendee list), 3 votes each — stack them or spread them. The
// list order FREEZES while the round runs (buttons must not jump underneath
// the voter) and re-sorts descending by vote total the moment the last person
// finishes. Round state is client-side (the huddle runs on one shared screen);
// every vote still writes through to the sheet as it's cast.
function startVotingRound_() {
  var att = attendees_();
  if (!att.length) { notify('No attendees on this huddle — pick the room on Start.', 'warn'); return; }
  var open = state.boot.issues.filter(function (i) { return i['Status'] === 'OPEN'; })
      .sort(function (a, b) { return (Number(b['Votes']) || 0) - (Number(a['Votes']) || 0); });
  if (!open.length) { notify('No open issues to vote on.', 'warn'); return; }
  // A clean round starts from zero — lingering votes from last week (or ad-hoc
  // taps) would pollute this round's totals.
  var hadVotes = open.some(function (i) { return (Number(i['Votes']) || 0) > 0; });
  if (hadVotes) {
    state.boot.issues.forEach(function (i) { if (i['Status'] === 'OPEN') i['Votes'] = 0; });
    serverSync(gs('l10_resetVotes'));
  }
  var start = Math.floor(Math.random() * att.length);
  state.voting = {
    order: att.slice(start).concat(att.slice(0, start)),
    idx: 0,
    left: 3,
    issueOrder: open.map(function (i) { return String(i['ID']); })
  };
  notify('🗳 ' + state.voting.order[0] + ' goes first (picked at random)' +
      (hadVotes ? ' — previous votes cleared' : ''), 'info', 4500);
  renderSegment();
}
// One vote just landed for the current voter — advance the turn when their
// 3 are spent; end the round (and let the list re-sort) after the last voter.
function votingCast_() {
  var v = state.voting;
  if (!v) return;
  v.left--;
  if (v.left > 0) { renderSegment(); return; }
  v.idx++;
  v.left = 3;
  if (v.idx >= v.order.length) {
    state.voting = null;
    notify('🗳 Voting complete — issues now ordered by votes', 'ok', 5000);
  } else {
    notify('🗳 ' + v.order[v.idx] + ' is up — 3 votes', 'info', 3500);
  }
  renderSegment();
}
// Skip whoever's turn it is (stepped out, abstaining) without votes.
function votingSkip_() {
  var v = state.voting;
  if (!v) return;
  var skipped = v.order[v.idx];
  v.idx++;
  v.left = 3;
  if (v.idx >= v.order.length) {
    state.voting = null;
    notify('🗳 ' + skipped + ' skipped — voting complete, issues ordered by votes', 'ok', 5000);
  } else {
    notify(skipped + ' skipped — ' + v.order[v.idx] + ' is up', 'info', 3000);
  }
  renderSegment();
}
function votingEnd_() {
  state.voting = null;
  notify('Round ended early — issues ordered by the votes cast so far', 'info', 4000);
  renderSegment();
}
function votingCardHtml_() {

function segIds() {

// --- Conclude segment ---
// Cascade — the talking points carried up after the huddle, in a
// standing order: wins → metrics → risks → asks. Values are never invented:
// anything not captured renders as a ___ blank to fill from the source.
function buildCascade() {
  var b = state.boot;
  var wk = b.weekOf;
  var m = b.openMeeting;
  var lines = ['Cascade — week of ' + wk + ' (business day ' + b.bday.n + ' of ' + b.bday.total + ')', ''];
  lines.push('Wins:');
  var wins = 0;
  b.headlines.filter(function (h) { return h['Cascade'] === 'YES' && !hlKilled_(h); })
      .forEach(function (h) { lines.push('- ' + h['Headline'] + ' (' + h['By'] + ')'); wins++; });
  if (m) {
    b.issues.filter(function (i) { return String(i['Solved In']) === String(m['ID']); })
        .forEach(function (i) { lines.push('- Solved: ' + i['Issue'] + ' → ' + (i['Resolution'] || 'see the issues list')); wins++; });
  }
  if (!wins) lines.push('- ___');
  lines.push('');
  lines.push('Metrics (fill blanks from the source before sending):');
  var offMetrics = [];
  b.scorecard.defs.filter(function (d) {
    return String(d['Active']).toUpperCase() === 'YES';
  }).forEach(function (d) {
    var v = (b.scorecard.values[String(d['ID'])] || {})[wk];
    var check = ruleCheck(d, v);
    if (check === 'off') offMetrics.push(String(d['Metric']));
    lines.push('- ' + d['Metric'] + ': ' + (v !== undefined ? fmtVal(v, d['Format']) : '___') +
        (check === 'off' ? '  ← off track' : ''));
  });
  lines.push('');
  if (b.hub && !b.hub.error && !b.hub.pending) {
    lines.push('Automation/testing: ' + b.hub.running + ' experiments live, ' + b.hub.needDecision + ' awaiting a decision.');
    lines.push('');
  }
  lines.push('Risks / off track:');
  var risks = 0;
  offMetrics.forEach(function (name) { lines.push('- ' + name + ' — off track this week'); risks++; });
  b.rocks.filter(function (r) { return String(r['Status']) === 'OFF TRACK'; }).forEach(function (r) {
    lines.push('- Rock off track: ' + r['Rock'] + ' (' + (r['Owner'] || '—') + ')');
    risks++;
  });
  if (!risks) lines.push('- none flagged this week');
  lines.push('');
  lines.push('Asks:');
  lines.push('- ___');
  lines.push('');
  lines.push('(Order: wins → metrics → risks → asks. A ___ means: pull the real number from the source first — never invent one.)');
  return lines.join('\n');
}
function buildRecap() {
  var b = state.boot;

// Shared row-action wiring (used by huddle segments AND the standalone pages).
// Status changes are OPTIMISTIC: patch local state + re-render immediately,
// then reconcile with the server in the background (errors revert via refresh).
function rerenderLists() {
  renderSegment();
  renderRocks();
  renderHeadlines();
  renderTodos();
  renderIssues();
  renderOneOnOne();
}
// okMsg is reserved for consequential outcomes — high-frequency flips pass
// nothing and let the optimistic row change speak. revert (optional) is a
// surgical rollback for the one mutated row; without it the error path falls
// back to the atomic refresh(), which repaints the whole app out from under
// an open editor or IDS card — so supply one wherever it can be written.
function serverSync(promise, okMsg, revert) {
  return promise.then(function (res) {
    if (res && res.ok === false) {
      errToast(res);
      if (revert) revert(); else refresh();
    } else if (okMsg) notify(okMsg, 'ok');
    return res;
  }).catch(function (e) {
    errToast(e);
    if (revert) revert(); else refresh();
  });
}
// Optimistic to-do status change + server write — reused by the toggle and its Undo.
// The re-render is deliberately narrow: a status flip repaints ONE row and the
// tiles, not six pages. A row that leaves its list (done, dropped, filtered out)
// still needs the full pass, so the splice reports whether it handled it.
function setTodoStatus_(id, status, opts) {
  opts = opts || {};
  var t = findRow(state.boot.todos, 'ID', id);
  if (t) {
    var wasOpen = todoOpen_(t['Status']);
    t['Status'] = status;
    t['Done At'] = status === 'DONE' ? localToday() : '';
    if (status === 'BLOCKED') t['Blocked On'] = opts.blockedOn || '';
    else if (t['Blocked On']) t['Blocked On'] = '';
    // Leaving (or entering) the owed set moves the row between lists — only
    // then does the whole page need rebuilding.
    var stillListed = wasOpen === todoOpen_(status) && todoMatches_(t);
    if (!stillListed || !spliceTodoRow_(id)) rerenderLists();
  }
  var pr = gs('l10_setTodoStatus', id, status, opts);
  // A weekly to-do completes into next week's copy — splice it in when the
  // server confirms (the extra .then never interferes with serverSync's).
  pr.then(function (res) {
    if (res && res.nextRow) {
      state.boot.todos.push(res.nextRow);
      rerenderLists();
      notify('↻ Weekly — queued again for next week', 'info', 3500);
    }
  });
  return pr;
}
// ---------------------------------------------------------------------------
// To-dos page controls. Everything here is scoped to #page-todos and is either
// transient view state (filters, selection, drawers) or a narrow server write.
// Kept out of wireShared because none of it belongs in the huddle segment: the
// room reads the list aloud, it doesn't filter or bulk-edit it.
// ---------------------------------------------------------------------------
// A selection the filter has hidden is a selection nobody can see or reason
// about, so narrowing the view drops it rather than keeping it armed offscreen.
function pruneHiddenSelection_() {
  var keep = {};
  todoSelectedVisible_().forEach(function (id) { keep[id] = 1; });
  state.todoSel = keep;
}
function wireTodoControls(scope) {
