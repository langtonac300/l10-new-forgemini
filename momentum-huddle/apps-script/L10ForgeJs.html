<script>
// ── Forge (v2.17) — timed idea-generation / goal-setting session ────────────
// Two views of one server-authoritative state: the ROOM (projector, run by the
// facilitator) and the PLAYER (each person's own laptop or phone, served on
// ?forge=FS-###). v2.18: the default day is one ideas round on a seeded wall →
// claim → write the goal → one peer review → commit → lock; the other phases
// render only when FORGE_PHASES lists them.
// Both poll l10_forgeState every few seconds and compute the clock from the
// server's timestamps, so every screen shows the same seconds. Writes go
// straight through; the next poll paints the result. Relies on L10Js.html's
// helpers ($, esc, gs, notify, who, avatar, personColor, lensGet_, togglePresent).

state.forge = {
  sid: null, s: null, version: 0, offset: 0, pollH: null, tickH: null, inflight: false,
  home: null, homeInflight: false, view: 'room', me: '', dirty: false, overSaid: false,
  cluster: null, plan: null, wheelEx: {}, wheelSpinning: false, newTitle: '', goalOpen: {},
  saveT: {}, tok: '', gate: null, goalMore: {}
};

// --- the passphrase gate --------------------------------------------------------
// A full-screen "loading" curtain that plays while the first call is in flight,
// then either dissolves (no password set, or already unlocked today) or asks for
// the passphrase. The word is checked on the server; the token it returns is
// kept for the day on this browser.
function forgeTok_() {
  if (state.forge.tok) return state.forge.tok;
  try {
    if (localStorage.getItem('l10ForgeTokDay') !== localToday()) return '';
    return localStorage.getItem('l10ForgeTok') || '';
  } catch (e) { return ''; }
}
function forgeTokSet_(t) {
  state.forge.tok = t;
  try { localStorage.setItem('l10ForgeTok', t); localStorage.setItem('l10ForgeTokDay', localToday()); } catch (e) {}
}
function forgeTokDrop_() {
  state.forge.tok = '';
  try { localStorage.removeItem('l10ForgeTok'); } catch (e) {}
}
var L10_GATE_LINES_ = ['Initialising the room', 'Sealing the cards', 'Loading the roster', 'Syncing the clock', 'Awaiting passphrase'];
function forgeGateShow_(onOpen) {
  var g = state.forge.gate;
  if (g) { g.onOpen = onOpen; return g; }
  var ov = $('forge-gate');
  if (!ov) { ov = document.createElement('div'); ov.id = 'forge-gate'; document.body.appendChild(ov); }
  var reduce = false;
  try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  ov.innerHTML = '<div class="fgate-grid"></div><div class="fgate-scan"></div><div class="fgate-in" role="dialog" aria-modal="true" aria-label="Forge is locked">' +
    '<div class="fgate-mark"><span class="fgate-bar"></span><span class="fgate-bar"></span><span class="fgate-bar"></span></div>' +
    '<div class="fgate-word">Momentum Huddle <b>Forge</b></div>' +
    '<div class="fgate-lines">' + L10_GATE_LINES_.map(function (l, i) { return '<div class="fgate-line" data-gl="' + i + '"><span class="fgate-dot">▸</span><span class="fgate-txt">' + esc(l) + '</span><span class="fgate-ok"></span></div>'; }).join('') + '</div>' +
    '<div class="fgate-track"><div class="fgate-fill"></div></div>' +
    '<form class="fgate-form" hidden><label class="fgate-lbl" for="fgate-pass">Passphrase</label><div class="fgate-row"><input id="fgate-pass" class="fgate-pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="••••••••"><button type="submit" class="fgate-go">Enter</button></div><div class="fgate-msg" aria-live="assertive"></div></form>' +
    '<div class="fgate-foot">Nothing on this screen is visible until the room is open.' +
    (document.body.classList.contains('forge-player') ? '' : ' <button type="button" class="fgate-back">Not now — back to the huddle</button>') + '</div></div>';
  ov.style.display = 'block';
  ov.classList.remove('fgate-open', 'fgate-deny');
  dlgOpened_('forge-gate');
  g = state.forge.gate = { ov: ov, onOpen: onOpen, step: 0, asking: false, timers: [] };
  var lines = ov.querySelectorAll('.fgate-line'), fill = ov.querySelector('.fgate-fill');
  var advance = function (to) {
    for (var i = 0; i < lines.length; i++) {
      lines[i].classList.toggle('on', i <= to);
      lines[i].classList.toggle('done', i < to);
    }
    fill.style.width = Math.min(92, (to + 1) / lines.length * 92) + '%';
    g.step = to;
  };
  if (reduce) advance(lines.length - 2);
  else {
    for (var i = 0; i < lines.length - 1; i++) (function (i) { g.timers.push(setTimeout(function () { advance(i); }, 260 + i * 420)); })(i);
  }
  var back = ov.querySelector('.fgate-back');
  if (back) back.addEventListener('click', function () {
    g.timers.forEach(clearTimeout);
    ov.style.display = 'none';
    dlgClosed_('forge-gate');
    state.forge.gate = null;
    state.forge.homeInflight = false;
    try { showPage('huddle'); } catch (e) {}
  });
  var form = ov.querySelector('.fgate-form');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var inp = ov.querySelector('.fgate-pass'), btn = ov.querySelector('.fgate-go'), msg = ov.querySelector('.fgate-msg');
    var pw = inp.value.trim();
    if (!pw) { msg.textContent = 'Type the passphrase.'; return; }
    btn.disabled = true; msg.textContent = 'Checking…';
    gs('l10_forgeUnlock', pw).then(function (r) {
      btn.disabled = false;
      if (!r || r.ok === false) {
        msg.textContent = 'Denied. ' + ((r && r.error) || 'Try again.');
        ov.classList.remove('fgate-deny'); void ov.offsetWidth; ov.classList.add('fgate-deny');
        inp.select();
        return;
      }
      forgeTokSet_(r.token);
      g.open();
    }).catch(function (e) { btn.disabled = false; msg.textContent = 'Could not check: ' + ((e && e.message) || e); });
  });
  g.askPass = function (why) {
    g.timers.forEach(clearTimeout); g.timers = [];
    advance(lines.length - 1);
    form.hidden = false;
    g.asking = true;
    var msg = ov.querySelector('.fgate-msg');
    if (why) msg.textContent = why;
    setTimeout(function () { try { ov.querySelector('.fgate-pass').focus(); } catch (e) {} }, 50);
  };
  g.open = function () {
    g.timers.forEach(clearTimeout); g.timers = [];
    for (var i = 0; i < lines.length; i++) { lines[i].classList.add('on', 'done'); }
    lines[lines.length - 1].querySelector('.fgate-txt').textContent = 'Access granted';
    fill.style.width = '100%';
    form.hidden = true;
    ov.classList.add('fgate-open');
    var done = function () {
      ov.style.display = 'none';
      dlgClosed_('forge-gate');
      state.forge.gate = null;
      if (typeof g.onOpen === 'function') g.onOpen();
    };
    if (reduce) done(); else setTimeout(done, 900);
  };
  return g;
}
// Every gated call routes its result through here: a locked answer raises the
// curtain (or switches it to the passphrase prompt); anything else lowers it.
function forgeGated_(res, retry) {
  if (res && res.ok === false && res.locked) {
    forgeTokDrop_();
    var g = forgeGateShow_(retry);
    g.onOpen = retry;
    g.askPass(res.error === 'Enter the passphrase first.' ? '' : res.error);
    return true;
  }
  if (state.forge.gate && !state.forge.gate.asking) {
    if (!forgeTok_()) forgeTokSet_('open');
    var gg = state.forge.gate; gg.onOpen = null; gg.open();
  }
  return false;
}

// --- identity: the roster name this device speaks as (kept per browser) -----
function forgeMe_() {
  if (state.forge.me) return state.forge.me;
  var n = '';
  try { n = localStorage.getItem('l10ForgeMe') || ''; } catch (e) {}
  if (!n) { try { n = lensGet_() || ''; } catch (e2) {} }
  state.forge.me = n;
  return n;
}
function forgeSetMe_(n) {
  state.forge.me = n;
  try { localStorage.setItem('l10ForgeMe', n); } catch (e) {}
}
function forgeTeam_() {
  var s = state.forge.s;
  if (s && s.cfg && s.cfg.team && s.cfg.team.length) return s.cfg.team;
  return (state.boot && state.boot.team) || [];
}
function forgePickHtml_(label) {
  return '<div class="card"><h3>' + esc(label || 'Who are you on this device?') + '</h3><div class="fg-pick">' +
    forgeTeam_().map(function (n) { return '<button type="button" data-fg-me="' + esc(n) + '">' + avatar(n) + esc(n) + '</button>'; }).join('') +
    '</div><div class="help">Remembered on this browser. No login — the roster is the door.</div></div>';
}

// --- entry points -----------------------------------------------------------
function renderForge(opened) {
  var el = $('page-forge');
  if (!el || state.forge.view === 'player') return;
  if (!state.boot || !hyd('core')) { el.innerHTML = '<div class="spinner">Loading…</div>'; return; }
  if (state.forge.sid) { forgeRenderRoom_(); return; }
  // Background hydration passes (hydRender_) only repaint what is already
  // loaded; the fetch — and the passphrase curtain — wait for a real open.
  if (!opened && !state.forge.home) { el.innerHTML = '<div class="spinner">Open Forge to load the sessions.</div>'; return; }
  // The passphrase curtain rises only when the server answers "locked"
  // (forgeGated_); with no FORGE_PASSWORD the page simply loads.
  if (opened || !state.forge.home) forgeFetchHome_();
  forgeRenderHome_();
}
function forgeFetchHome_() {
  if (state.forge.homeInflight) return;
  state.forge.homeInflight = true;
  gs('l10_forgeHome', forgeTok_()).then(function (h) {
    state.forge.homeInflight = false;
    if (forgeGated_(h, forgeFetchHome_)) return;
    state.forge.home = h;
    if (!state.forge.sid) forgeRenderHome_();
  }).catch(function (e) { state.forge.homeInflight = false; errToast(e); });
}

function forgeRenderHome_() {
  var el = $('page-forge');
  var h = state.forge.home;
  var me = forgeMe_();
  var html = '<div class="fg-head"><h2 class="page-title">Forge</h2><span class="muted txt-sub">the goals-day session: one big screen, everyone on their own laptop</span></div>';
  if (!h) { el.innerHTML = html + '<div class="spinner">Loading sessions…</div>'; return; }
  if (h.enabled === false) { el.innerHTML = html + '<div class="banner info">Forge is switched off (FORGE_ENABLED = NO in L10_Config).</div>'; return; }
  if (!h.ready) {
    el.innerHTML = html + '<div class="banner warn">The Forge tabs are not in this workbook yet — run <b>Momentum Huddle → Setup / repair tabs</b> once, then reload.</div>';
    return;
  }
  if (!me) { el.innerHTML = html + forgePickHtml_(); forgeWireHome_(el); return; }
  html += '<div class="row row--mid mb-2"><span class="who-chip">' + avatar(me) + esc(me) + '</span><button class="btn mini subtle" data-fg-changeme>not me</button>' +
    (h.wheel !== false ? '<button class="btn mini subtle" data-fg-wheel>🎡 Pick someone</button>' : '') + '</div>';
  var open = (h.sessions || []).filter(function (x) { return x.status === 'OPEN'; });
  if (open.length) {
    html += '<div class="card resume-card"><h3>A session is open</h3>' + open.map(function (x) {
      return '<div class="fg-sess"><div><div class="t">' + esc(x.title) + ' <span class="muted">' + esc(x.id) + '</span></div>' +
        '<div class="m">' + esc(x.date) + ' · ' + esc(x.phase) + ' · ' + x.participants.length + ' in · ' + x.ideas + ' cards · ' + x.goals + ' goals · run by ' + esc(x.facilitator) + '</div></div>' +
        '<button class="btn" data-fg-open="' + esc(x.id) + '">Open the room</button>' +
        '<button class="btn subtle mini" data-fg-discard="' + esc(x.id) + '">discard</button></div>';
    }).join('') + '</div>';
  }
  html += '<div class="card"><h3>New session</h3><div class="row row--end">' +
    '<div class="field f-2"><label>Title</label><input class="js-fg-title" placeholder="FY27 goals day" value="' + esc(state.forge.newTitle) + '"></div>' +
    '<div class="field f-fix"><button class="btn js-fg-create">Create and open the room</button></div></div>' +
    '<div class="help">You become the facilitator. The room opens in the Lobby' + (h.seeds ? ' with ' + h.seeds + ' cards already on the wall (the FY27 goals and the team backlog)' : '') +
    '; everyone else joins from their laptop with the link the Lobby shows.</div></div>';
  var past = (h.sessions || []).filter(function (x) { return x.status !== 'OPEN'; });
  if (past.length) {
    html += '<div class="card"><h3>Past sessions</h3>' + past.map(function (x) {
      return '<div class="fg-sess"><div><div class="t">' + esc(x.title) + ' <span class="muted">' + esc(x.id) + '</span></div>' +
        '<div class="m">' + esc(x.date) + ' · ' + esc(x.status.toLowerCase()) + ' · ' + x.ideas + ' cards · ' + x.goals + ' goals' + (x.rating !== null ? ' · rated ' + x.rating + '/10' : '') + '</div></div>' +
        '<button class="btn mini subtle" data-fg-open="' + esc(x.id) + '">view</button></div>';
    }).join('') + '</div>';
  }
  // The day as configured (FORGE_PHASES), not a fixed script.
  var flow = ['Lobby'].concat(h.phases && h.phases.length ? h.phases : ['New ideas', 'Claim', 'Write the goal', 'Peer review', 'Commit']).concat(['Lock']);
  html += '<div class="card"><h3>How it runs</h3><p class="fg-note">' + flow.map(esc).join(' → ') + '. The wall starts seeded with the FY27 goals and the team backlog; the ideas round adds what is missing; everyone claims the cards they will own, writes each one up as a SMART goal, gets one peer review, and commits a Q1 milestone. ' +
    (h.timedWrite ? 'The facilitator can fire a <b>Timed write</b> at any point and ' : 'The facilitator can ') + 'spin the <b>wheel</b> whenever someone has to go first. Lock writes goals to each person\'s FY27 Goals tab and creates priorities from the Q1 milestones. It never creates to-dos.</p></div>';
  el.innerHTML = html;
  forgeWireHome_(el);
}
function forgeWireHome_(el) {
  el.querySelectorAll('[data-fg-me]').forEach(function (b) {
    b.addEventListener('click', function () { forgeSetMe_(b.dataset.fgMe); renderForge(); });
  });
  var chg = el.querySelector('[data-fg-changeme]');
  if (chg) chg.addEventListener('click', function () { forgeSetMe_(''); renderForge(); });
  var wh = el.querySelector('[data-fg-wheel]');
  if (wh) wh.addEventListener('click', function () { wheelOpen_(forgeTeam_(), 'home'); });
  var ti = el.querySelector('.js-fg-title');
  if (ti) ti.addEventListener('input', function () { state.forge.newTitle = ti.value; });
  var cr = el.querySelector('.js-fg-create');
  if (cr) cr.addEventListener('click', function () {
    cr.disabled = true;
    gs('l10_forgeCreate', state.forge.newTitle, forgeMe_(), forgeTok_()).then(function (r) {
      cr.disabled = false;
      if (forgeGated_(r, function () { renderForge(true); })) return;
      if (!r || r.ok === false) { errToast(r || 'Create failed'); return; }
      state.forge.newTitle = '';
      forgeOpen_(r.id);
    }).catch(function (e) { cr.disabled = false; errToast(e); });
  });
  el.querySelectorAll('[data-fg-open]').forEach(function (b) {
    b.addEventListener('click', function () { forgeOpen_(b.dataset.fgOpen); });
  });
  el.querySelectorAll('[data-fg-discard]').forEach(function (b) {
    b.addEventListener('click', function () {
      if (!armedConfirm(b, { label: 'discard it?', danger: true }, function () {
        gs('l10_forgeDiscard', b.dataset.fgDiscard).then(function (r) {
          if (!r || r.ok === false) { errToast(r || 'Discard failed'); return; }
          notify('Session discarded', 'ok'); forgeFetchHome_();
        }).catch(errToast);
      })) return;
    });
  });
}

// --- session open / poll / clock -------------------------------------------
function forgeOpen_(sid) {
  forgeStop_();
  state.forge.sid = sid;
  state.forge.version = 0;
  state.forge.s = null;
  state.forge.cluster = null;
  state.forge.overSaid = false;
  forgePollNow_();
  var sec = 3;
  state.forge.pollH = setInterval(forgePollNow_, sec * 1000);
  state.forge.tickH = setInterval(forgeTick_, 1000);
  var el = $('page-forge');
  if (el && state.forge.view !== 'player') el.innerHTML = '<div class="spinner">Opening the room…</div>';
}
function forgeStop_() {
  clearInterval(state.forge.pollH); clearInterval(state.forge.tickH);
  state.forge.pollH = null; state.forge.tickH = null;
}
function forgeClose_() {
  forgeStop_();
  state.forge.sid = null; state.forge.s = null;
  state.forge.home = null;
  renderForge(true);
}
function forgePollNow_(force) {
  if (!state.forge.sid) return;
  if (force === true) state.forge.forceRender = true;
  if (state.forge.inflight) { state.forge.pollAgain = true; return; }
  if (document.visibilityState === 'hidden') return;
  state.forge.inflight = true;
  gs('l10_forgeState', state.forge.sid, state.forge.version, forgeMe_(), forgeTok_()).then(function (st) {
    state.forge.inflight = false;
    if (forgeGated_(st, forgePollNow_)) return;
    forgeApply_(st);
    if (state.forge.pollAgain) { state.forge.pollAgain = false; forgePollNow_(); }
  }).catch(function (e) { state.forge.inflight = false; console.warn('forge poll', e); });
}
function forgeApply_(st) {
  if (!st) return;
  if (st.ok === false) { errToast(st); if (!state.forge.s) forgeClose_(); return; }
  if (st.serverNow) state.forge.offset = Date.now() - st.serverNow;
  if (st.unchanged) return;
  var prevPhase = state.forge.s ? state.forge.s.session.phase + '/' + state.forge.s.session.round : '';
  state.forge.s = st;
  state.forge.version = st.version;
  var nowPhase = st.session.phase + '/' + st.session.round;
  if (prevPhase && prevPhase !== nowPhase) {
    state.forge.overSaid = false;
    state.forge.cluster = null;
    var live = $('fg-live');
    if (live) live.textContent = 'Now: ' + forgePhaseLabel_() + '.';
    if (state.forge.view === 'player') try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  }
  // If a poll adjusts the pollSec, re-arm.
  if (st.cfg && st.cfg.pollSec && state.forge.pollH) {
    clearInterval(state.forge.pollH);
    state.forge.pollH = setInterval(forgePollNow_, Math.max(2, st.cfg.pollSec) * 1000);
  }
  forgeRender_();
}
function forgeAfterWrite_(res, okMsg) {
  if (res && res.ok === false) { errToast(res); return false; }
  if (okMsg) notify(okMsg, 'ok', 1800);
  forgePollNow_(true); // our own write: repaint even if a box has focus (and keep that focus)
  return true;
}
function forgeTyping_() {
  var a = document.activeElement;
  if (!a) return false;
  var tag = a.tagName;
  if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT') return false;
  var pg = $('page-forge');
  return !!(pg && pg.contains(a) && a.hasAttribute('data-fg-keep'));
}
function forgeRender_() {
  var force = state.forge.forceRender;
  state.forge.forceRender = false;
  if (!force && forgeTyping_()) { state.forge.dirty = true; return; }
  // A forced repaint (after our own write) remembers the focused control by
  // its class and hands focus back, so a phone keyboard never drops mid-burst.
  var a = document.activeElement, keep = null, keepVal = null;
  if (force && a && a.hasAttribute && a.hasAttribute('data-fg-keep')) {
    keep = a.className.split(/\s+/).filter(function (c) { return c.indexOf('js-') === 0; })[0] || null;
    keepVal = (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') ? a.value : null;
  }
  state.forge.dirty = false;
  if (state.forge.view === 'player') forgeRenderPlayer_(); else forgeRenderRoom_();
  if (keep) {
    var el2 = document.querySelector('#page-forge .' + keep);
    if (el2) { if (keepVal !== null && keepVal !== '' && el2.value === '') el2.value = keepVal; try { el2.focus({ preventScroll: true }); } catch (e) { el2.focus(); } }
  }
}
document.addEventListener('focusout', function () {
  if (state.forge.dirty && state.forge.sid) setTimeout(function () { if (state.forge.dirty && !forgeTyping_()) forgeRender_(); }, 150);
});

function forgeNow_() { return Date.now() - state.forge.offset; }
function forgeRemain_(ses) {
  if (!ses || !ses.phaseStartedAt || !ses.phaseSeconds) return null;
  var end = ses.phaseStartedAt + ses.phaseSeconds * 1000;
  var now = ses.pausedAt || forgeNow_();
  return Math.round((end - now) / 1000);
}
function forgeTwRemain_(tw) {
  if (!tw) return null;
  return Math.round((tw.startedAt + tw.seconds * 1000 - forgeNow_()) / 1000);
}
function forgeFmt_(sec) {
  var over = sec < 0, t = Math.abs(sec);
  return (over ? '+' : '') + Math.floor(t / 60) + ':' + ('0' + (t % 60)).slice(-2);
}
function forgeTick_() {
  var s = state.forge.s;
  if (!s) return;
  var ses = s.session;
  var tw = ses.timedWrite;
  var rem = tw ? forgeTwRemain_(tw) : forgeRemain_(ses);
  var total = tw ? tw.seconds : ses.phaseSeconds;
  document.querySelectorAll('[data-fg-clock]').forEach(function (el) {
    if (rem === null) { el.textContent = '--:--'; return; }
    el.textContent = forgeFmt_(rem);
    el.classList.toggle('over', rem < 0);
    el.classList.toggle('paused', !tw && !!ses.pausedAt);
  });
  document.querySelectorAll('[data-fg-fill]').forEach(function (el) {
    if (rem === null || !total) { el.style.width = '0%'; return; }
    el.style.width = Math.min(100, (total - rem) / total * 100) + '%';
    el.classList.toggle('over', rem < 0);
  });
  var gl = $('fg-glyph');
  if (gl) gl.textContent = tw ? '✎ writing' : (ses.pausedAt ? '⏸ paused' : (rem !== null && rem < 0 ? '⚑ over time' : '▶ running'));
  if (rem !== null && rem < 0 && !state.forge.overSaid) {
    state.forge.overSaid = true;
    var live = $('fg-live');
    if (live) live.textContent = 'Time is up.';
    if (state.forge.view === 'room' && String(((state.boot || {}).config || {}).TIMER_CHIME || 'YES').toUpperCase() !== 'NO') { try { l10Chime_(); } catch (e) {} }
  }
}

// --- phase helpers ----------------------------------------------------------
function forgeS_() { return state.forge.s; }
function forgePhaseKey_() { var s = forgeS_(); return s ? s.session.phase : 'LOBBY'; }
function forgePhaseDef_(key) {
  var s = forgeS_();
  if (!s) return null;
  for (var i = 0; i < s.phases.length; i++) if (s.phases[i].key === key) return s.phases[i];
  return null;
}
function forgePhaseIdx_(key) {
  var s = forgeS_();
  if (!s) return -1;
  for (var i = 0; i < s.phases.length; i++) if (s.phases[i].key === key) return i;
  return key === 'LOCKED' ? s.phases.length : -1;
}
function forgePast_(key) { return forgePhaseIdx_(forgePhaseKey_()) >= forgePhaseIdx_(key); }
function forgePhaseLabel_() {
  var k = forgePhaseKey_();
  if (k === 'LOBBY') return 'Lobby';
  if (k === 'LOCKED') return 'Locked';
  var d = forgePhaseDef_(k);
  var s = forgeS_();
  return (d ? d.label : k) + (d && d.rounds > 1 ? ' · round ' + s.session.round + ' of ' + d.rounds : '');
}
function forgeIsFac_() { var s = forgeS_(); return !!s && s.session.facilitator === forgeMe_(); }
function forgeCards_() {
  var s = forgeS_();

function forgeWirePlayer_(el) {
  var sid = state.forge.sid, me = forgeMe_();
  var q = function (sel, fn) { el.querySelectorAll(sel).forEach(fn); };
  q('[data-fg-me]', function (b) { b.addEventListener('click', function () { forgeSetMe_(b.dataset.fgMe); forgePollNow_(); forgeRenderPlayer_(); }); });
  q('[data-fg-changeme]', function (b) { b.addEventListener('click', function () { forgeSetMe_(''); forgeRenderPlayer_(); }); });
  q('[data-fg-join]', function (b) {
    b.addEventListener('click', function () { b.disabled = true; gs('l10_forgeJoin', sid, me).then(function (r) { forgeAfterWrite_(r, 'You\'re in'); }).catch(function (e) { b.disabled = false; errToast(e); }); });
  });
  var add = el.querySelector('.js-fg-add');
  if (add) {
    var text = el.querySelector('.js-fg-text');
    var submit = function () {
      var v = text.value.trim();
      if (!v) return;
      add.disabled = true;
      gs('l10_forgeAddIdea', sid, me, v).then(function (r) {
        add.disabled = false;
        if (forgeAfterWrite_(r)) { text.value = ''; try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {} notify('Card added', 'ok', 1200); }
      }).catch(function (e) { add.disabled = false; errToast(e); });
    };
    add.addEventListener('click', submit);
    text.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); submit(); } });
  }
  q('[data-fg-edit]', function (b) {
    b.addEventListener('click', function () {
      var card = b.closest('.fg-card'), ct = card.querySelector('.fg-ct');
      var cur = ct.textContent;
      ct.innerHTML = '<textarea data-fg-keep class="js-fg-editta" style="width:100%">' + esc(cur) + '</textarea>';
      b.textContent = 'save';
      b.onclick = function () {
        var v = card.querySelector('.js-fg-editta').value.trim();
        gs('l10_forgeEditIdea', b.dataset.fgEdit, me, v).then(function (r) { forgeAfterWrite_(r, 'Updated'); }).catch(errToast);
      };
    });
  });
  q('[data-fg-drop]', function (b) {
    b.addEventListener('click', function () {
      if (!armedConfirm(b, { label: 'drop?', danger: true }, function () { gs('l10_forgeDropIdea', b.dataset.fgDrop, me).then(function (r) { forgeAfterWrite_(r, 'Dropped'); }).catch(errToast); })) return;
    });
  });
  // Opener
  q('[data-fg-oplab]', function (b) {
    b.addEventListener('click', function () {
      var parts = b.dataset.fgOplab.split('|');
      state.forge.opDraft = state.forge.opDraft || {};
      state.forge.opDraft[parts[0]] = parts[1];
      b.parentElement.querySelectorAll('.pill--btn').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
    });
  });
  q('[data-fg-opsave]', function (b) {
    b.addEventListener('click', function () {
      var d = state.forge.opDraft || {};
      if (!Object.keys(d).length) { notify('Label at least one statement.', 'warn'); return; }
      b.disabled = true;
      gs('l10_forgeOpener', sid, me, JSON.stringify(d)).then(function (r) { b.disabled = false; forgeAfterWrite_(r, 'Labels in'); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  // Relay
  q('[data-fg-build-save]', function (b) {
    b.addEventListener('click', function () {
      var ta = el.querySelector('[data-fg-build="' + b.dataset.fgBuildSave + '"]');
      b.disabled = true;
      gs('l10_forgeBuild', b.dataset.fgBuildSave, me, ta ? ta.value : '').then(function (r) { b.disabled = false; forgeAfterWrite_(r, 'Added'); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  // Votes
  q('[data-fg-vote]', function (b) {
    b.addEventListener('click', function () {
      var parts = b.dataset.fgVote.split('|');
      var fn = parts[1] === 'UNSUPER' ? 'l10_forgeUnvote' : 'l10_forgeVote';
      var kind = parts[1] === 'UNSUPER' ? 'SUPER' : parts[1];
      b.disabled = true;
      gs(fn, sid, me, parts[0], kind).then(function (r) { b.disabled = false; forgeAfterWrite_(r); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  q('[data-fg-unvote]', function (b) {
    b.addEventListener('click', function () {
      var parts = b.dataset.fgUnvote.split('|');
      b.disabled = true;
      gs('l10_forgeUnvote', sid, me, parts[0], parts[1]).then(function (r) { b.disabled = false; forgeAfterWrite_(r); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  // Claim
  q('[data-fg-claim]', function (b) { b.addEventListener('click', function () { b.disabled = true; gs('l10_forgeClaim', b.dataset.fgClaim, me).then(function (r) { forgeAfterWrite_(r, 'Claimed'); }).catch(function (e) { b.disabled = false; errToast(e); }); }); });
  q('[data-fg-unclaim]', function (b) { b.addEventListener('click', function () { b.disabled = true; gs('l10_forgeUnclaim', b.dataset.fgUnclaim, me).then(function (r) { forgeAfterWrite_(r, 'Released'); }).catch(function (e) { b.disabled = false; errToast(e); }); }); });
  // Handoffs
  var hoTo = el.querySelector('.js-ho-to');
  if (hoTo) hoTo.addEventListener('change', function () { el.querySelector('.js-ho-other').style.display = hoTo.value === '__other' ? '' : 'none'; });
  var hoAdd = el.querySelector('.js-ho-add');
  if (hoAdd) hoAdd.addEventListener('click', function () {
    var to = hoTo.value === '__other' ? el.querySelector('.js-ho-toname').value.trim() : hoTo.value;
    hoAdd.disabled = true;
    gs('l10_forgeHandoff', sid, me, to, el.querySelector('.js-ho-need').value, el.querySelector('.js-ho-provide').value, el.querySelector('.js-ho-due').value)
      .then(function (r) { hoAdd.disabled = false; forgeAfterWrite_(r, 'Handoff added'); }).catch(function (e) { hoAdd.disabled = false; errToast(e); });
  });
  q('[data-fg-ho]', function (b) {
    b.addEventListener('click', function () {
      var parts = b.dataset.fgHo.split('|');
      b.disabled = true;
      gs('l10_forgeHandoffRespond', parts[0], me, parts[1], null).then(function (r) { b.disabled = false; forgeAfterWrite_(r, parts[1] === 'ACCEPTED' ? 'Accepted' : 'Done'); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  q('[data-fg-ho-neg]', function (b) {
    b.addEventListener('click', function () {
      var row = b.closest('.h');
      var h = (forgeS_().handoffs || []).filter(function (x) { return x.id === b.dataset.fgHoNeg; })[0];
      if (!h) return;
      row.innerHTML = '<div class="grow fg-form"><div class="field"><label>Counter: what I can give</label><input data-fg-keep class="js-neg-need" value="' + esc(h.need) + '"></div><div class="field"><label>By</label><input type="date" data-fg-keep class="js-neg-due" value="' + esc(h.due) + '"></div><button class="btn mini js-neg-go">Send the counter</button></div>';
      row.querySelector('.js-neg-go').addEventListener('click', function () {
        gs('l10_forgeHandoffRespond', h.id, me, 'NEGOTIATED', { need: row.querySelector('.js-neg-need').value, due: row.querySelector('.js-neg-due').value })
          .then(function (r) { forgeAfterWrite_(r, 'Counter sent'); }).catch(errToast);
      });
    });
  });
  // Goals
  q('[data-fg-newgoal]', function (b) {
    b.addEventListener('click', function () {
      var parts = b.dataset.fgNewgoal.split('|');
      b.disabled = true;
      gs('l10_forgeSaveGoal', sid, me, { type: parts[0], ideaId: parts[1] || '', title: '' }).then(function (r) {
        b.disabled = false;
        if (forgeAfterWrite_(r, 'Card created')) state.forge.goalOpen[r.id] = true;
      }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  q('[data-fg-goaltoggle]', function (b) {
    b.addEventListener('click', function () { var id = b.dataset.fgGoaltoggle; state.forge.goalOpen[id] = state.forge.goalOpen[id] === false; forgeRenderPlayer_(); });
  });
  q('[data-fg-goalmore]', function (b) {
    b.addEventListener('click', function () {
      var id = b.dataset.fgGoalmore;
      var g = (forgeS_().goals || []).filter(function (x) { return x.id === id; })[0] || {};
      var cur = state.forge.goalMore[id] !== undefined ? state.forge.goalMore[id] : !!(g.rung || g.lever || g.guardrail || g.stake || g.shift || g.dependency);
      state.forge.goalMore[id] = !cur;
      forgeRenderPlayer_();
    });
  });
  var saveGoal = function (id, quiet) {
    var f = el.querySelector('[data-fg-goalform="' + id + '"]');
    if (!f) return;
    var g = {};
    f.querySelectorAll('[data-gf]').forEach(function (i) { g[i.dataset.gf] = i.type === 'checkbox' ? i.checked : i.value; });
    var st = f.querySelector('.js-gf-status');
    if (st) st.textContent = 'saving…';
    gs('l10_forgeSaveGoal', sid, me, Object.assign({ id: id }, g)).then(function (r) {
      if (st) st.textContent = r && r.ok === false ? '⚠ ' + (r.error || 'not saved') : 'saved';
      if (r && r.ok === false && !quiet) errToast(r);
      if (r && r.ok !== false) forgePollNow_();
    }).catch(function (e) { if (st) st.textContent = 'not saved'; if (!quiet) errToast(e); });
  };
  q('[data-fg-goalsave]', function (b) { b.addEventListener('click', function () { saveGoal(b.dataset.fgGoalsave, false); }); });
  q('[data-fg-goalform] [data-gf]', function (i) {
    var id = i.closest('[data-fg-goalform]').dataset.fgGoalform;
    i.addEventListener('change', function () { clearTimeout(state.forge.saveT[id]); state.forge.saveT[id] = setTimeout(function () { saveGoal(id, true); }, 400); });
  });
  q('[data-fg-goaldrop]', function (b) {
    b.addEventListener('click', function () {
      if (!armedConfirm(b, { label: 'drop it?', danger: true }, function () { gs('l10_forgeDropGoal', b.dataset.fgGoaldrop, me).then(function (r) { forgeAfterWrite_(r, 'Dropped'); }).catch(errToast); })) return;
    });
  });
  // Doctor
  q('[data-fg-docsave]', function (b) {
    b.addEventListener('click', function () {
      var f = el.querySelector('[data-fg-docform="' + b.dataset.fgDocsave + '"]');
      var checks = {};
      f.querySelectorAll('[data-dc]').forEach(function (c) { checks[c.dataset.dc] = c.checked; });
      var verdict = f.querySelector('[data-dverdict]').value;
      if (!verdict) { notify('Pick a verdict.', 'warn'); return; }
      b.disabled = true;
      gs('l10_forgeDoctor', b.dataset.fgDocsave, me, forgeS_().session.round, checks, f.querySelector('[data-dnote]').value, verdict)
        .then(function (r) { b.disabled = false; forgeAfterWrite_(r, 'Review in'); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  });
  // Rating
  var rate = el.querySelector('.js-fg-rate');
  if (rate) {
    rate.addEventListener('input', function () { el.querySelector('.js-fg-rateval').textContent = rate.value; });
    el.querySelector('.js-fg-ratesave').addEventListener('click', function () {
      var b = this; b.disabled = true;
      gs('l10_forgeRate', sid, me, Number(rate.value), el.querySelector('.js-fg-ratenote').value).then(function (r) { b.disabled = false; forgeAfterWrite_(r, 'Thanks'); }).catch(function (e) { b.disabled = false; errToast(e); });
    });
  }
}

// --- The wheel ----------------------------------------------------------------
// Client-only: Math.random over the not-excluded names; the spin is presentation.
// Exclusions are per session (kept in memory) so the same person is not picked
// twice unless everyone is put back in.
function wheelOpen_(names, ctx) {
  names = (names || []).filter(String);
  if (!names.length) { notify('Nobody on the roster to pick from.', 'warn'); return; }
  var ov = $('wheel-overlay');
  if (!ov) { ov = document.createElement('div'); ov.id = 'wheel-overlay'; document.body.appendChild(ov); }
  var ex = state.forge.wheelEx;
  var render = function (winner) {
    var n = names.length;
    var seats = names.map(function (nm, i) {
      var ang = (i / n) * 2 * Math.PI - Math.PI / 2;
      var rx = 50 + 36 * Math.cos(ang), ry = 50 + 36 * Math.sin(ang);
      return '<div class="wheel-seat' + (ex[nm] ? ' out' : '') + '" style="left:' + rx.toFixed(1) + '%;top:' + ry.toFixed(1) + '%">' + avatar(nm) + '<span class="nm">' + esc(nm) + '</span></div>';
    }).join('');
    var wedges = names.map(function (nm, i) { return personColor(nm) + ' ' + (i / n * 360).toFixed(1) + 'deg ' + ((i + 1) / n * 360).toFixed(1) + 'deg'; }).join(', ');
    var left = names.filter(function (nm) { return !ex[nm]; });
    ov.innerHTML = '<div class="ids-backdrop" data-wh-close></div><div class="ids-card wheel-card" role="dialog" aria-modal="true" aria-label="Pick someone">' +
      '<h3>🎡 Pick someone</h3><div class="wheel-stage"><div class="wheel-ptr"></div><div class="wheel-disc js-wh-disc" style="background:conic-gradient(from -90deg, ' + wedges + ')">' + seats + '</div></div>' +
      '<div class="wheel-win" aria-live="assertive">' + (winner ? esc(winner) : '&nbsp;') + '</div><div class="wheel-sub">' + (winner ? winner + ' goes first.' : left.length + ' of ' + n + ' in the draw') + '</div>' +
      '<div class="row" style="justify-content:center"><button class="btn big js-wh-spin"' + (left.length ? '' : ' disabled') + '>' + (winner ? 'Spin again' : 'Spin') + '</button>' +
      (winner && !ex[winner] ? '<button class="btn subtle js-wh-out">Take ' + esc(winner) + ' out for the rest</button>' : '') +
      (Object.keys(ex).some(function (k) { return ex[k]; }) ? '<button class="btn subtle js-wh-reset">Everyone back in</button>' : '') +
      '<button class="btn subtle" data-wh-close>Close</button></div></div>';
    ov.querySelectorAll('[data-wh-close]').forEach(function (b) { b.addEventListener('click', function () { ov.style.display = 'none'; dlgClosed_('wheel-overlay'); }); });
    var out = ov.querySelector('.js-wh-out');
    if (out) out.addEventListener('click', function () { ex[winner] = true; render(null); });
    var rs = ov.querySelector('.js-wh-reset');
    if (rs) rs.addEventListener('click', function () { state.forge.wheelEx = ex = {}; render(null); });
    ov.querySelector('.js-wh-spin').addEventListener('click', function () {
      if (state.forge.wheelSpinning) return;
      var pool = names.filter(function (nm) { return !ex[nm]; });
      if (!pool.length) return;
      var pick = pool[Math.floor(Math.random() * pool.length)];
      var idx = names.indexOf(pick);
      var disc = ov.querySelector('.js-wh-disc');
      var reduce = false;
      try { reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
      // Seat i sits at angle i/n·360 from the top; rotate so it lands under the pointer.
      var target = 360 * 4 - (idx / names.length) * 360 - (360 / names.length) / 2 + (360 / names.length) / 2;
      state.forge.wheelSpinning = true;
      var finish = function () { state.forge.wheelSpinning = false; render(pick); };
      if (reduce) { finish(); return; }
      disc.style.transform = 'rotate(' + target + 'deg)';
      setTimeout(finish, 3300);
    });
  };
  render(null);
  ov.style.display = 'block';
  dlgOpened_('wheel-overlay');
}

// --- boot for the player route ------------------------------------------------
if (window.__L10_FORGE) forgePlayerBoot_(window.__L10_FORGE);
</script>
